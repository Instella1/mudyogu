# 뮤됴구 자동 배포
#   main 브랜치에 올라오면 → Flutter 3.35.4 로 빌드 → GitHub Pages 에 배포
#   배포되면 설치된 앱(PWA)이 version.json 변화를 보고 "새 버전 있음" 배너를 띄운다.
name: 빌드 & 배포

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # build.sh 가 git short hash 를 buildId 에 넣음

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4   # ⚠️ 업그레이드 금지 (검증된 조합)
          channel: stable
          cache: true

      - name: 패키지 받기
        run: flutter pub get

      - name: 문법 검사 (flutter analyze)
        run: flutter analyze

      - name: 서비스워커 문법 검사
        run: node --check web/service_worker.js

      - name: 게임에 외부 URL 이 없는지 검사 (오프라인 보호)
        run: |
          if grep -rnE "(src|href)=[\"']https?://|url\(['\"]?https?://|@import ['\"]?https?://" web/games; then
            echo "❌ 게임 파일에 외부 URL 이 있습니다. 로컬 파일로 바꿔주세요."; exit 1
          fi

      - name: 빌드 (build.sh)
        run: ./build.sh

      - name: 하위 폴더 배포용 상대경로 (base href → ./)
        run: python3 tools/patch_web.py build/web --relative-base

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

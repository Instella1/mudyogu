<!DOCTYPE html>
<html lang="ko">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="뮤됴구 - 작은 게임들을 한 곳에서. 오프라인에서도 플레이할 수 있는 미니게임 허브."
    />
    <meta name="theme-color" content="#2FCC8B" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="뮤됴구" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />

    <title>뮤됴구</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f7fcf9;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0e1311;
        }
      }
      /* 부분 확대: Flutter 가 body 에 touch-action:none 을 넣어 터치스크린 핀치가 막힌다.
         두 손가락 확대만 브라우저에 허용 (한 손가락 스크롤·탭은 그대로 Flutter 가 받음) */
      body,
      flutter-view {
        touch-action: pinch-zoom !important;
      }
      /* 첫 로딩 스플래시 (Flutter 부팅 전) */
      #mud-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f7fcf9;
        z-index: 9999;
        transition: opacity 0.32s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Malgun Gothic', system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #mud-splash {
          background: #0e1311;
        }
      }
      #mud-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      .mud-mark {
        width: 78px;
        height: 78px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #63e6b0, #2fcc8b 55%, #14ac76);
        box-shadow: 0 14px 34px rgba(47, 204, 139, 0.36);
        color: #06301f;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .mud-bar {
        width: 108px;
        height: 3px;
        border-radius: 3px;
        background: rgba(47, 204, 139, 0.22);
        overflow: hidden;
      }
      .mud-bar > i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 3px;
        background: #2fcc8b;
        animation: mud-slide 1.1s ease-in-out infinite;
      }
      @keyframes mud-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .mud-name {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #2fcc8b;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="mud-splash">
      <div class="mud-mark">뮤</div>
      <div class="mud-name">MUDYOGU</div>
      <div class="mud-bar"><i></i></div>
    </div>

    <script>
      // 확대 허용: Flutter 는 Ctrl+휠(크롬북 터치패드 두 손가락 벌리기도 이것)을 받아서
      // preventDefault 해 버려 앱 화면에서는 확대가 아예 안 됐다(게임 위에서만 되어 들쭉날쭉).
      // Flutter 보다 먼저(window 캡처 단계) 받아서 Flutter 로 안 넘기면 브라우저가 평소처럼 확대한다.
      window.addEventListener(
        'wheel',
        function (e) {
          if (e.ctrlKey) e.stopImmediatePropagation();
        },
        { capture: true, passive: true }
      );
    </script>
    <script>
      // 부분 확대(두 손가락으로 벌려 그 부분만 크게 보기) 허용.
      // Flutter 가 부팅하면서 viewport 메타를 'maximum-scale=1.0, user-scalable=no' 로 덮어써
      // 폰·터치스크린에서 핀치 확대가 막혔다 → 덮어쓸 때마다 다시 확대 가능으로 되돌린다.
      (function () {
        var WANT = 'width=device-width, initial-scale=1, viewport-fit=cover';
        function fix() {
          var ms = document.querySelectorAll('meta[name="viewport"]');
          for (var i = 0; i < ms.length; i++) {
            if (ms[i].content !== WANT) ms[i].content = WANT;
          }
        }
        fix();
        new MutationObserver(fix).observe(document.head, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['content'],
        });
      })();

      // Flutter 는 앱 크기를 visualViewport.width/height 로 잰다. 두 손가락으로 확대하면 이 값이
      // '보이는 부분' 크기로 줄어서, 앱이 그 크기로 쪼그라들고 나머지가 하얗게 깨졌다.
      // → 확대 중(scale>1)일 때만 확대 전 크기를 돌려준다. 확대 안 했을 때는 원래 값 그대로
      //   (폰 키보드가 올라올 때 높이가 줄어드는 건 그대로 전달됨).
      (function () {
        var VV = window.VisualViewport && window.VisualViewport.prototype;
        if (!VV) return;
        ['width', 'height'].forEach(function (k) {
          var d = Object.getOwnPropertyDescriptor(VV, k);
          if (!d || !d.get) return;
          Object.defineProperty(VV, k, {
            configurable: true,
            enumerable: d.enumerable,
            get: function () {
              var v = d.get.call(this);
              var s = this.scale;
              return s > 1.01 ? v * s : v;
            },
          });
        });
      })();
    </script>
    <script>
      // 비밀번호 재설정 메일의 링크로 들어왔을 때 (주소 끝 #...type=recovery)
      // → 새 비밀번호 입력창을 띄워 Supabase 에 바꿔 달라고 한다. Flutter 가 주소의 # 를
      //   길(route)로 읽지 않도록, 앱이 뜨기 전에 주소에서 지운다.
      (function () {
        var SB_URL = 'https://nvpvdkxovknhqglfbhmv.supabase.co';
        var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52cHZka3hvdmtuaHFnbGZiaG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4ODA1NDgsImV4cCI6MjEwODQ1NjU0OH0.sbayovYN3rAJIoqGXcBLzaEMlZ4CCIn7I_PO6pFRHUs';
        var h = location.hash || '';
        if (h.indexOf('type=recovery') < 0 && h.indexOf('error_description') < 0) return;
        var q = new URLSearchParams(h.replace(/^#\/?/, ''));
        history.replaceState(null, '', location.pathname + location.search);
        var token = q.get('access_token');
        var box = document.createElement('div');
        box.id = 'mud-reset';
        box.style.cssText = 'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(14,19,17,.55);font-family:system-ui,sans-serif;padding:16px';
        var card = '<div style="background:#fff;color:#14231c;border-radius:20px;padding:24px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)">';
        if (!token) {
          box.innerHTML = card + '<h2 style="margin:0 0 8px;font-size:20px">링크가 만료됐어요</h2><p style="margin:0 0 16px;font-size:14px;color:#56635d">로그인 화면의 \'비밀번호를 잊었어요\'에서 메일을 다시 받아 주세요.</p><button id="mr-close" style="width:100%;height:44px;border:0;border-radius:12px;background:#2fcc8b;font-weight:700;font-size:15px">확인</button></div>';
        } else {
          box.innerHTML = card + '<h2 style="margin:0 0 8px;font-size:20px">새 비밀번호 정하기</h2><p style="margin:0 0 14px;font-size:13px;color:#56635d">6자 이상으로 입력해 주세요.</p>' +
            '<input id="mr-p1" type="password" placeholder="새 비밀번호" style="width:100%;box-sizing:border-box;height:44px;border:1px solid #d5ddd9;border-radius:12px;padding:0 12px;font-size:15px;margin-bottom:8px">' +
            '<input id="mr-p2" type="password" placeholder="한 번 더" style="width:100%;box-sizing:border-box;height:44px;border:1px solid #d5ddd9;border-radius:12px;padding:0 12px;font-size:15px">' +
            '<p id="mr-msg" style="min-height:18px;margin:8px 0;font-size:13px;color:#d45a6e"></p>' +
            '<button id="mr-ok" style="width:100%;height:44px;border:0;border-radius:12px;background:#2fcc8b;font-weight:700;font-size:15px">비밀번호 바꾸기</button></div>';
        }
        function mount() {
          document.body.appendChild(box);
          var close = document.getElementById('mr-close');
          if (close) close.onclick = function () { box.remove(); };
          var ok = document.getElementById('mr-ok');
          if (!ok) return;
          ok.onclick = function () {
            var p1 = document.getElementById('mr-p1').value, p2 = document.getElementById('mr-p2').value;
            var msg = document.getElementById('mr-msg');
            if (p1.length < 6) { msg.textContent = '6자 이상 입력해 주세요.'; return; }
            if (p1 !== p2) { msg.textContent = '두 비밀번호가 달라요.'; return; }
            ok.disabled = true; msg.textContent = '';
            fetch(SB_URL + '/auth/v1/user', {
              method: 'PUT',
              headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: p1 })
            }).then(function (r) {
              if (!r.ok) throw new Error(String(r.status));
              box.innerHTML = card + '<h2 style="margin:0 0 8px;font-size:20px">바꿨어요!</h2><p style="margin:0 0 16px;font-size:14px;color:#56635d">새 비밀번호로 로그인해 주세요.</p><button id="mr-close2" style="width:100%;height:44px;border:0;border-radius:12px;background:#2fcc8b;font-weight:700;font-size:15px">확인</button></div>';
              document.getElementById('mr-close2').onclick = function () { box.remove(); };
            }).catch(function () {
              ok.disabled = false;
              msg.textContent = '바꾸지 못했어요. 링크가 만료됐을 수 있어요. 메일을 다시 받아 주세요.';
            });
          };
        }
        if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
      })();
    </script>
    <script src="flutter_bootstrap.js" async></script>
    <script>
      // Flutter 첫 프레임 이후 스플래시 제거
      (function () {
        var splash = document.getElementById('mud-splash');
        function hide() {
          if (!splash || splash.classList.contains('hide')) return;
          splash.classList.add('hide');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }
        window.addEventListener('flutter-first-frame', hide);
        // 안전장치
        setTimeout(hide, 9000);
      })();

      // 서비스워커 등록 (Flutter 코드에서도 등록하지만, 부팅 전 캐싱을 위해 여기서도)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('service_worker.js')
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="뮤됴구 - 작은 게임들을 한 곳에서. 오프라인에서도 플레이할 수 있는 미니게임 허브."
    />
    <meta name="theme-color" content="#2FCC8B" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="뮤됴구" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />

    <title>뮤됴구</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f7fcf9;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0e1311;
        }
      }
      /* 첫 로딩 스플래시 (Flutter 부팅 전) */
      #mud-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f7fcf9;
        z-index: 9999;
        transition: opacity 0.32s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Malgun Gothic', system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #mud-splash {
          background: #0e1311;
        }
      }
      #mud-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      .mud-mark {
        width: 78px;
        height: 78px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #63e6b0, #2fcc8b 55%, #14ac76);
        box-shadow: 0 14px 34px rgba(47, 204, 139, 0.36);
        color: #06301f;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .mud-bar {
        width: 108px;
        height: 3px;
        border-radius: 3px;
        background: rgba(47, 204, 139, 0.22);
        overflow: hidden;
      }
      .mud-bar > i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 3px;
        background: #2fcc8b;
        animation: mud-slide 1.1s ease-in-out infinite;
      }
      @keyframes mud-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .mud-name {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #2fcc8b;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="mud-splash">
      <div class="mud-mark">뮤</div>
      <div class="mud-name">MUDYOGU</div>
      <div class="mud-bar"><i></i></div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
    <script>
      // Flutter 첫 프레임 이후 스플래시 제거
      (function () {
        var splash = document.getElementById('mud-splash');
        function hide() {
          if (!splash || splash.classList.contains('hide')) return;
          splash.classList.add('hide');
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }
        window.addEventListener('flutter-first-frame', hide);
        // 안전장치
        setTimeout(hide, 9000);
      })();

      // 서비스워커 등록 (Flutter 코드에서도 등록하지만, 부팅 전 캐싱을 위해 여기서도)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('service_worker.js')
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>

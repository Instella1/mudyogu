<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>한(일)남 LIFE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- 오프라인 번들 폰트 (CDN 미사용) -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* 레이아웃: 상단 상태바 + 탭 + 무대(장면/대화창/경기). 학교 게시판의 차가운 종이색 위에 운동장 잔디색 하나를 포인트로 쓴다. */
:root{
  --bg:#e7ecf0; --surface:#ffffff; --surface-2:#f2f5f8; --ink:#152238; --muted:#5a6779; --line:#d2d9e2;
  --turf:#25764a; --turf-ink:#ffffff; --turf-soft:#dcebe1; --gold:#9c6c12; --gold-soft:#f3e7cc; --red:#bf3a2f; --red-soft:#f6dedb; --blue:#2b5ea6;
  --pitch-a:#3b8c55; --pitch-b:#34804d; --chalk:rgba(255,255,255,.72);
  --f-display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-story:'Gowun Batang','AppleMyungjo','Nanum Myeongjo',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c131e; --surface:#141e2e; --surface-2:#1a273b; --ink:#e5eaf1; --muted:#93a0b4; --line:#26354b;
  --turf:#4bb174; --turf-ink:#07160d; --turf-soft:#173527; --gold:#e3b24e; --gold-soft:#3a2f17; --red:#ee6f63; --red-soft:#3d1d1a; --blue:#7ea9ec;
  --pitch-a:#2f7547; --pitch-b:#2a6a40; --chalk:rgba(255,255,255,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c131e; --surface:#141e2e; --surface-2:#1a273b; --ink:#e5eaf1; --muted:#93a0b4; --line:#26354b;
  --turf:#4bb174; --turf-ink:#07160d; --turf-soft:#173527; --gold:#e3b24e; --gold-soft:#3a2f17; --red:#ee6f63; --red-soft:#3d1d1a; --blue:#7ea9ec;
  --pitch-a:#2f7547; --pitch-b:#2a6a40; --chalk:rgba(255,255,255,.6); color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tab:focus-visible,.pp:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.h2{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.01em;margin:0 0 10px;text-wrap:balance}
.h3{font-weight:700;font-size:15px;margin:0 0 8px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid2>*{min-width:0}

/* 타이틀 */
.title{display:grid;gap:22px;padding-block:28px 8px}
.logo{font-family:var(--f-display);font-weight:400;line-height:.95;font-size:clamp(52px,13vw,112px);letter-spacing:-.01em;margin:0}
.logo .paren{color:var(--turf)}
.logo .life{display:block;font-size:.52em;letter-spacing:.14em;color:var(--muted)}
.title-sub{font-family:var(--f-story);font-size:17px;max-width:34em;margin:0}
.chalkline{height:6px;background:repeating-linear-gradient(90deg,var(--turf) 0 28px,transparent 28px 40px);border-radius:3px;opacity:.85}
.slots{display:grid;gap:8px}
.slot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.slot b{font-weight:700}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.err{color:var(--red);font-weight:600}

/* 상단바 */
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.01em}
.brand .paren{color:var(--turf)}
.date{font-family:var(--f-display);font-size:24px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
.pill.inj{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.pill.fame{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--turf)}

/* 장면 */
.scene{position:relative;height:clamp(190px,34vh,300px);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.sc-ceremony{background:radial-gradient(ellipse 60% 70% at 50% 0%,rgba(255,226,170,.42),transparent 70%),repeating-linear-gradient(180deg,transparent 0 14px,rgba(0,0,0,.18) 14px 18px) bottom/100% 32% no-repeat,linear-gradient(180deg,#2c2136 0%,#4b2f40 58%,#5e3a3c 100%)}
.sc-class{background:linear-gradient(#2f4b40,#2a443a) 12% 14%/76% 38% no-repeat,linear-gradient(90deg,rgba(255,255,255,.0) 0 8%,rgba(255,255,255,.55) 8% 9%,transparent 9%) 0 0/100% 60% no-repeat,repeating-linear-gradient(90deg,#9a6c45 0 46px,#8c6141 46px 92px) bottom/100% 26% no-repeat,linear-gradient(180deg,#dfe3d6 0%,#cfd6c6 74%)}
.sc-field{background:linear-gradient(90deg,transparent calc(50% - 1px),var(--chalk) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),radial-gradient(circle at 50% 70%,transparent 54px,var(--chalk) 55px 57px,transparent 58px),repeating-linear-gradient(90deg,#3b8c55 0 60px,#347f4d 60px 120px) bottom/100% 62% no-repeat,linear-gradient(180deg,#8ec7ea 0%,#c9e6f4 38%)}
.sc-dorm{background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,214,140,.85) 22px 40px,transparent 40px 62px) 10% 30%/80% 16px no-repeat,repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,214,140,.55) 22px 40px,transparent 40px 62px) 10% 55%/80% 16px no-repeat,linear-gradient(180deg,#141b33 0%,#24305a 70%,#2e3a62 100%)}
.sc-hall{background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(190,220,255,.35),transparent 70%),repeating-linear-gradient(180deg,transparent 0 12px,rgba(0,0,0,.2) 12px 16px) bottom/100% 30% no-repeat,linear-gradient(180deg,#1d2a40 0%,#2f3f5c 100%)}
.sc-home{background:radial-gradient(circle at 78% 30%,#ffd28a 0 34px,transparent 36px),linear-gradient(180deg,#f2a76b 0%,#f6c99a 46%,#7f9a6e 46%,#6c875c 100%)}
.sc-exam{background:repeating-linear-gradient(90deg,#b98a5f 0 70px,transparent 70px 96px) 0 72%/100% 22px no-repeat,linear-gradient(#2f4b40,#2a443a) 20% 12%/60% 30% no-repeat,linear-gradient(180deg,#e2e5da 0%,#d1d6c8 100%)}
.portrait{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.face{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:30px;border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.face.me{border-color:#ffd66b}
.ptag{background:rgba(10,16,28,.72);color:#fff;font-size:12px;padding:2px 9px;border-radius:999px}
.scene-cap{position:absolute;left:12px;top:10px;background:rgba(10,16,28,.6);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px 16px;display:grid;gap:12px;cursor:pointer}
.dlg.lock{cursor:default}
.who{font-weight:700;font-size:14px;color:var(--turf)}
.who.me{color:var(--gold)}
.txt{font-family:var(--f-story);font-size:18px;line-height:1.75;max-width:40em;min-height:3.4em}
.txt.narr{color:var(--muted);font-style:normal}
.choices{display:grid;gap:8px}
.choices .btn{text-align:left;font-family:var(--f-story);font-weight:700;font-size:16px}
.hint{font-size:12px;color:var(--muted);text-align:right}

/* 피치 */
.pitch{position:relative;width:100%;max-width:420px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch-a) 0 12.5%,var(--pitch-b) 12.5% 25%);margin-inline:auto}
.pl{position:absolute;border:2px solid var(--chalk)}
.dot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:86px;text-align:center}
.dot .c{width:34px;height:34px;border-radius:50%;background:#fff;color:#152238;display:grid;place-items:center;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.dot.me .c{background:#ffd66b}
.dot.off .c{background:#f2c4bf}
.dot .n{color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.7);line-height:1.2;white-space:nowrap}
.pp{appearance:none;position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;min-width:52px}
.pp.main{background:#ffd66b;color:#152238;border-color:#ffd66b}
.pp.sub{background:rgba(255,255,255,.9);color:#152238}

/* 경기 */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:#13213a;color:#fff;border-radius:16px;padding:16px}
.board .tn{font-weight:700;font-size:15px;line-height:1.3}
.board .tn.r{text-align:right}
.board .tn small{display:block;font-weight:400;opacity:.7;font-size:12px}
.score{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.clock{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;opacity:.9}
.bar{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#6fd393}
.feed{display:grid;gap:6px;max-height:340px;overflow:auto;padding-right:4px}
.ev{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:baseline;padding:7px 10px;border-radius:10px;background:var(--surface-2)}
.ev .m{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.ev.goal{background:var(--turf-soft)}
.ev.goal b.tag{background:var(--turf);color:var(--turf-ink);border-radius:5px;padding:0 6px;margin-right:6px;font-size:12px}
.ev.hero{outline:2px solid var(--gold)}
.ev.sys{background:transparent;color:var(--muted)}
.lu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.lu>*{min-width:0}
.slotsel{display:grid;grid-template-columns:44px 1fr;gap:6px 8px;align-items:center;font-size:13px}
.slotsel select{padding:6px 8px;font-size:13px}

/* 표/목록 */
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;font-size:12px}
.tbl tr.mine td{background:var(--gold-soft);font-weight:700}
.tbl tr.q td:first-child{box-shadow:inset 3px 0 0 var(--turf)}
.stat{display:grid;grid-template-columns:72px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.sbar{height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.sbar i{display:block;height:100%;background:var(--turf)}
.big{font-family:var(--f-display);font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface-2)}
.chip.main{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.chip.w{background:var(--turf-soft);border-color:var(--turf)}
.chip.l{background:var(--red-soft);border-color:var(--red)}
.chip.d{background:var(--surface-2)}
.chip.inj{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.list{display:grid;gap:6px}
.li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:14px}
.li>span{min-width:0}
.fxd{flex-basis:100%;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px}
.heart{color:var(--red);letter-spacing:1px}
.li.me{background:var(--gold-soft);font-weight:700}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cell{min-height:64px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:11px;background:var(--surface);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell.today{outline:2px solid var(--gold)}
.cell.past{opacity:.6}
.cell.vac{background:var(--surface-2)}
.cell .dn{font-weight:700;font-size:12px}
.tg{display:block;border-radius:4px;padding:0 3px;font-size:10.5px;line-height:1.5;background:var(--surface-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg.m{background:var(--turf-soft)}
.tg.x{background:var(--gold-soft)}
.tg.r{background:var(--red-soft)}

/* 점호 */
#rollcall{position:fixed;inset:0;z-index:50;cursor:pointer;overflow:hidden;color:#fff;
  background:radial-gradient(ellipse 30% 12% at 20% 22%,rgba(255,255,255,.75),transparent 70%),radial-gradient(ellipse 26% 10% at 78% 16%,rgba(255,255,255,.65),transparent 70%),radial-gradient(ellipse 34% 11% at 64% 84%,rgba(255,255,255,.6),transparent 70%),radial-gradient(ellipse 22% 9% at 14% 78%,rgba(255,255,255,.55),transparent 70%),linear-gradient(180deg,#2f7fcb 0%,#5aa6e3 45%,#9ccff0 80%,#d4ecf8 100%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2vh;text-align:center;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#rollcall[hidden]{display:none!important}
.chip.trophy{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
#trophy{position:fixed;inset:0;z-index:60;cursor:pointer;overflow:hidden;color:#fff;background:radial-gradient(ellipse 70% 55% at 50% 38%,rgba(255,206,92,.38),transparent 70%),linear-gradient(180deg,#0f1a33 0%,#1b2a4d 60%,#0f1a33 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#trophy[hidden]{display:none!important}
#trophy canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#trophy svg{width:min(42vw,200px);height:auto;filter:drop-shadow(0 10px 30px rgba(255,190,60,.45));position:relative}
#trophy .tt{font-family:var(--f-display);font-size:clamp(34px,9vw,72px);line-height:1.05;color:#ffd66b;position:relative;text-wrap:balance}
#trophy .ts{font-size:16px;opacity:.92;position:relative}
#trophy .tb{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;font-size:13px;opacity:.75}
@media (prefers-reduced-motion: no-preference){#trophy svg{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}#trophy .tt{animation:rise .6s .2s ease-out both}}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
#rollcall .rc-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;font-weight:600;font-size:14px;letter-spacing:.12em;opacity:.95}
#rollcall .rc-l{font-family:var(--f-display);font-weight:400;line-height:1.02;font-size:min(16.5vw,19vh);text-shadow:0 4px 24px rgba(20,60,120,.35);white-space:nowrap}
#rollcall .rc-bot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;font-size:13px;color:#16365e;font-weight:600}
@media (prefers-reduced-motion: no-preference){
  #rollcall .rc-l{animation:rise .7s ease-out both}
  #rollcall .rc-l+ .rc-l{animation-delay:.18s}
  @keyframes rise{from{transform:translateY(18px);opacity:.2}to{transform:none;opacity:1}}
}
@media (max-width:520px){
  .txt{font-size:16.5px}
  .score{font-size:36px}
  .date{font-size:20px}
  .big{font-size:44px}
  .cell{min-height:54px}
}
</style>

</head>

<!-- 뮤됴구 SDK -->
<script src="../mudyogu-sdk.js"></script>
<script>
(function () {
  if (!window.MudyoguSDK) return;
  var MUD = MudyoguSDK.create();
  window.MUD = MUD;

  // 앱(iframe) 안이면 여백을 줄여 화면을 넓게 쓴다
  if (MUD.isEmbedded) {
    document.documentElement.classList.add('mud-embed');
  }

  // 저장된 진행상황 복원 (마지막 시즌 요약을 화면에 띄우지 않고 참고용으로만 사용)
  MUD.onInit(function (payload) {
    window.MUDYOGU_LAST = payload || {};
  });

  // 저장 헬퍼 (게임 코드에서 window.mudyoguSave(...) 로 호출)
  window.mudyoguSave = function (payload) {
    try { MUD.save(payload || {}); } catch (e) {}
  };

  // ── 기록 코드 연동 ────────────────────────────────────────────
  // 이 게임의 '리포트 코드' 를 앱 계정에 보관해 두면,
  // 다른 기기에서도 앱이 코드를 자동으로 넘겨줘 그대로 복원됩니다.
  window.mudyoguStoreCode = function (code) {
    try { MUD.saveCode({ code: String(code || ''), label: '리포트 코드' }); }
    catch (e) {}
  };

  var pendingCode = null;
  function applyPendingCode() {
    if (!pendingCode) return;
    var code = pendingCode;
    if (typeof window.mudyoguRestore === 'function') {
      try { window.mudyoguRestore(code); pendingCode = null; } catch (e) {}
    }
  }
  window.mudyoguApplyPendingCode = applyPendingCode;

  MUD.onCode(function (code) {
    if (!code) return;
    // 게임 코드가 아직 준비 안 됐으면 보관했다가 준비되면 적용
    if (typeof window.mudyoguRestore === 'function') {
      try { window.mudyoguRestore(code); } catch (e) {}
    } else {
      pendingCode = code;
      var tries = 0;
      var t = setInterval(function () {
        tries++;
        if (typeof window.mudyoguRestore === 'function' || tries > 100) {
          clearInterval(t);
          applyPendingCode();
        }
      }, 100);

  1:{n:'이정우',tr:'인자한 성격',intro:'다들 반가워. 너무 긴장하지 말고, 힘든 일 있으면 언제든 선생님 찾아와.',counsel:h=>`${callN(h.name)}, 축구 열심히 하는 거 선생님도 다 보고 있다.`,ask:'대신 밥 꼭 챙겨 먹고, 공부도 조금씩은 하자. 알았지?',yes:'그래, 너라면 할 수 있어.',no:'허허, 솔직해서 좋다. 그래도 다치지만 마라.',home:['어제 비 와서 쌀쌀하지? 다들 감기 조심해라.','요즘 다들 얼굴이 피곤해 보인다. 오늘은 일찍들 자.','아침 먹고 온 사람? 안 먹은 사람은 쉬는 시간에 매점이라도 다녀와라.'],sports:'이기든 지든 다치지만 말고 와라. 끝나고 선생님이 음료수 쏜다.',exam:'시험 끝나면 마음껏 뛰어. 오늘만 조금 참자.',vac:'한 학기 고생 많았다. 방학 때 푹 쉬고, 건강하게 보자.'},

function tri(a,b,c){const u=Math.random(),F=(c-a)/(b-a);return u<F?a+Math.sqrt(u*(b-a)*(c-a)):b-Math.sqrt((1-u)*(b-a)*(b-c))}

function lsPlace(k,txt){const T0=LS_PLACE[k];if(!txt)return 0;if(T0[txt]!=null)return T0[txt];if(/조 준우승$/.test(txt))return 90;if(/조 4강$/.test(txt))return 50;if(/조 8강$/.test(txt))return 20;return 0}
function computeLS(r){
  const items=[];const add=(label,v)=>{v=Math.round(v);if(v)items.push([label,v])};
  add(`최종 오버롤 ${r.ovr}`,(+r.ovr)*10);
  add(`명성 ${r.fame}`,Math.max(-100,Math.min(500,r.fame*2)));
  const st=r.st||{};add(`${st.g||0}골 ${st.a||0}도움`,(st.g||0)*13+(st.a||0)*10);
  add(`${st.w||0}승`,(st.w||0)*10);
  if(st.mom)add(`MOM ${st.mom}회`,st.mom*5);
  if(st.csG)add(`골키퍼 클린시트 ${st.csG}회`,st.csG*20);
  if(st.csD)add(`수비 무실점 ${st.csD}회`,st.csD*14);
  if(st.sv)add(`선방 ${st.sv}개`,st.sv*1);
  if(st.tk)add(`수비 성공 ${st.tk}회`,st.tk*.8);
  if(st.kp)add(`키패스 ${st.kp}개`,st.kp*3);
  const rt=parseFloat(st.rt);if(!isNaN(rt))add(`평균 평점 ${st.rt}`,(rt-6)*100);
  for(const k of Object.keys(LS_PLACE)){const c=r.comps&&r.comps[k];if(c)add(`${LS_COMP_NAME[k]} ${c.txt}`,lsPlace(k,c.txt))}
  for(const t of (r.titles||[]))add(t,{'1학년장':300,'호실장':80,'스카우트 관심':200}[t]||0);
  if(r.rank)add(`39기 ${r.rank}위`,r.rank===1?300:r.rank<=3?200:r.rank<=10?100:r.rank<=30?40:0);
  if(r.partner)add(`짝꿍 ${r.partner.n} 호감도 ${r.partner.a}`,r.partner.a*1.5);
  const fa=sum((r.friends||[]).map(f=>f.a));add('친한 친구들',fa/5);
  const total=sum(items.map(x=>x[1]));
  const grade=total>=4500?'S+':total>=3700?'S':total>=3000?'A':total>=2300?'B':total>=1600?'C':'D';
  return {total,grade,items};
}

function mudyoguSync(rec){
  try{
    if(!rec||typeof window.mudyoguSave!=='function')return;
    const st=(rec.st||{});
    const wins=(st.w||0), games=(st.n||0);
    // 점수: 최종 오버롤 x10 + 명성 + 승리 보너스

    const score=Math.round(ovrNum*10 + (rec.fame||0)*2 + wins*3);
    const slots=(LS.get(SLOT_KEY)||[]).filter(Boolean);
    window.mudyoguSave({
      score: score,
      state: {
        version: 1,
        playerName: rec.name,
        ovr: rec.ovr,
        fame: rec.fame,
        rank: rec.rank,
        season: `${rec.at}`,
        matches: games,
        wins: wins,
        goals: (st.g||0),
        assists: (st.a||0),
        trophies: rec.trophies||[],
        titles: rec.titles||[],
        savedReports: slots.length,
        lastLs: rec.ls||0
      },
      isGameOver: true
    });
  }catch(e){}
}

/* ===================== 스탯 생성 ===================== */
function genPot(Tt,pos,subs,hero){
  let w=POS_W[pos].slice();
  for(const sp of subs)POS_W[sp].forEach((x,i)=>{w[i]+=x*.15});
  if(hero)KEY[pos].forEach(i=>{w[i]*=1.9});
  if(['ST','LW','RW','AM'].includes(pos)&&!hero&&Math.random()<.15)w[5]=1.1;
  w=w.map(x=>x*rnd(.82,1.18));
  const out=Array(8).fill(0);let rem=Tt;
  if(pos!=='GK'){out[6]=subs.includes('GK')?(Tt<650?ri(50,80):ri(80,115)):(Tt<650?ri(15,45):ri(30,70));rem-=out[6];w[6]=0}
  const free=new Set();w.forEach((x,i)=>{if(x>0)free.add(i)});
  for(let it=0;it<12;it++){
    const sw=[...free].reduce((a,i)=>a+w[i],0);if(!sw)break;
    const base=rem;let capped=false;
    for(const i of [...free]){if(base*w[i]/sw>150){out[i]=150;rem-=150;free.delete(i);capped=true}}
    if(!capped){for(const i of free)out[i]=base*w[i]/sw;break}
  }
  const r=out.map(v=>Math.round(v));let d=Tt-sum(r),g=0;
  while(d!==0&&g++<2000){const s=d>0?1:-1;let bi=-1,bv=-1;
    for(let i=0;i<8;i++){if(pos!=='GK'&&i===6)continue;if(s>0&&r[i]>=150)continue;if(s<0&&r[i]<=5)continue;const v=s>0?150-r[i]:r[i];if(v>bv){bv=v;bi=i}}
    if(bi<0)break;r[bi]+=s;d-=s}
  return r;
}
function npcCur(pot,gen){
  const g=gen===37?(Math.random()<.1?ri(20,40):ri(5,20)):gen===38?(Math.random()<.1?ri(30,60):ri(10,25)):(Math.random()<.15?ri(50,100):ri(20,40));
  const ws=pot.map(v=>v*rnd(.5,1.5)),sw=sum(ws);
  const cur=pot.map((v,i)=>Math.max(1,v-Math.floor(g*ws[i]/sw)));
  let d=(sum(pot)-g)-sum(cur),k=0;
  while(d<0&&k<5000){const j=k++%8;if(cur[j]>1){cur[j]--;d++}}
  return cur;
}
function heroCur(pot){return pot.map(v=>Math.max(8,Math.round(v*rnd(.67,.75))))}
function randName(used){for(let k=0;k<500;k++){const n=wpick(SURN,s=>{const i=SURN.indexOf(s);return 20/Math.pow(i+1,1.1)+.3})+pick(GIVEN);if(!used.has(n)){used.add(n);return n}}return '무명'+used.size}

function activeCands(cls,heroName){const pc=PARTNERS[cls];let c=pc.main.slice();if(heroName&&c.some(n=>norm(n)===norm(heroName)))c=c.filter(n=>norm(n)!==norm(heroName)).concat(pc.alt);return c}

function genWorld(hPos,hSubs){

    const stars=cl.filter(p=>p.tier==='star').length;

    shuffle(cl.filter(p=>p.tier==='gen')).slice(0,extra).forEach(p=>p.tier='ace');
  }
  // 37·38기 등급
  ps.forEach(p=>{if(fix38(p)){p.tier='star';p.fixed=true}});

    cl.slice(0,ns).forEach(p=>p.tier='star');cl.slice(ns,ns+na).forEach(p=>p.tier='ace');
  }
  // 포지션
  for(const p of ps){if(p.tier==='hero')continue;
    p.pos=wpick(POS,x=>POS_DIST[x]);

    // 서브는 보통 비슷한 자리지만, 가끔은 전혀 다른 자리도 본다 (예: CB인데 ST)
    for(let k=0;k<n;k++){const near=p.pos!=='GK'&&Math.random()<.75;const pool=(near?ADJ[p.pos]:POS.filter(x=>x!=='GK')).filter(x=>x!==p.pos&&!p.subs.includes(x));if(pool.length)p.subs.push(pick(pool))}
    if(p.pos!=='GK'&&p.subs.length<2&&Math.random()<.06)p.subs.push('GK');
    const fx=fix38(p);if(fx){const L=fx[0].split('/');p.pos=L[0];p.subs=L.slice(1);if(p.subs.length<2&&Math.random()<.3){const pool=ADJ[p.pos].filter(x=>x!==p.pos&&!p.subs.includes(x));if(pool.length)p.subs.push(pick(pool))}}}
  // 호실팀·39기 반마다 골키퍼 최소 1명

  for(const r of ROOMS)ensureGK(ps.filter(p=>p.room===r));
  for(let c=1;c<=5;c++)ensureGK(ps.filter(p=>p.gen===39&&p.cls===c));
  // 포텐셜 총합 (0.1 단위 정수)
  for(const p of ps){
    const fx=fix38(p);if(fx){p.potT=ri(fx[1],fx[2]);continue}
    p.potT=p.tier==='hero'?ri(950,1050):p.tier==='star'?(p.gen===39?ri(840,910):ri(850,920)):p.tier==='ace'?ri(820,870):p.tier==='weak'?ri(500,570):Math.min(1050,Math.round(tri(65,81,75)*10));
  }
  // 기수별 85 이상 인원을 39기 ±4명 이내로
  const cnt=g=>ps.filter(p=>p.gen===g&&p.potT>=850).length,c39=cnt(39);

function roomRanking(){

function squad(sp){
  const ps=S.players;

  if(sp.k==='class')return ps.filter(p=>p.ccls===sp.cls);

  if(sp.k==='all'){const g=ps.filter(p=>p.gen===sp.gen).sort((a,b)=>effOvr(b)-effOvr(a));const top=g.slice(0,20);

function autoLineup(sq,mustId,formId,opt){
  opt=opt||{};
  const E=new Map(sq.map(p=>[p.id,eff(p)]));
  const nz=new Map(sq.map(p=>[p.id,opt.vary?rnd(.88,1):1]));
  const sv=(p,pos)=>posRating(E.get(p.id),pos)*fit(p,pos)*nz.get(p.id)*(opt.senior&&p.gen===37?1.6:1);
  const forms=formId===FORM6.id?[FORM6]:formId?FORMS.filter(f=>f.id===formId):FORMS;
  let best=null;
  for(const f of forms){
    const slots=f.slots.map(s=>({pos:s.pos,x:s.x,y:s.y,pid:null}));const taken=new Set();let tot=0;
    if(mustId!=null){const h=sq.find(p=>p.id===mustId);if(h){let bi=0,bv=-1;slots.forEach((s,i)=>{const v=sv(h,s.pos)*(s.pos===h.pos?1.15:1);if(v>bv){bv=v;bi=i}});slots[bi].pid=h.id;taken.add(h.id);tot+=sv(h,slots[bi].pos)+(slots[bi].pos===h.pos?3:0)}}
    const order=slots.map((s,i)=>i).filter(i=>slots[i].pid==null).sort((a,b)=>PRI[slots[a].pos]-PRI[slots[b].pos]);
    for(const i of order){let bp=null,bv=-1;for(const p of sq){if(taken.has(p.id))continue;const v=sv(p,slots[i].pos);if(v>bv){bv=v;bp=p}}if(bp){slots[i].pid=bp.id;taken.add(bp.id);tot+=bv}}
    if(!best||tot>best.tot)best={form:f.id,slots,tot};
  }
  return best;
}
function teamCtx(lu){
  let a=0,aw=0,d=0,dw=0,m=0,mw=0,gk=null;const ps=[];
  for(const s of lu.slots){if(s.pid==null)continue;const p=P(s.pid),e=eff(p),v=posRating(e,s.pos)*fit(p,s.pos);ps.push({p,pos:s.pos,e,v});
    a+=v*ATT_W[s.pos];aw+=ATT_W[s.pos];d+=v*DEF_W[s.pos];dw+=DEF_W[s.pos];m+=v*MID_W[s.pos];mw+=MID_W[s.pos];if(s.pos==='GK')gk={p,e}}
  const pen=1-Math.max(0,lu.slots.length-ps.length)*.06;
  return {att:a/(aw||1)*pen,def:d/(dw||1)*pen,mid:m/(mw||1)*pen,gk,ps};
}
function pickShooter(t){const c=t.ps.filter(x=>x.pos!=='GK');return wpick(c,x=>SHW[x.pos]*Math.pow(x.e[4]/10+.2,1.6)*(x.p.id===S.hero?1.25:1))}
function pickAssist(t,sh){const c=t.ps.filter(x=>x!==sh);return wpick(c,x=>ASW[x.pos]*Math.pow(x.e[3]/10+.2,1.5)*(x.p.id===S.hero?1.15:1))}
const isG=e=>e.t==='goal'||e.t==='pgoal';
const isScore=e=>isG(e)||e.t==='og';
function rateAll(m){
  const res=m.res,R=new Map();
  m.ctx.forEach((t,s)=>t.ps.forEach(x=>R.set(x.p.id,{pid:x.p.id,s,pos:x.pos,g:0,a:0,pg:0,pm:0,og:0,sv:0,on:0,post:0,off:0,kp:0,tk:0,er:0,so:[]})));
  for(const e of res.ev){
    const r=R.get(e.sh);
    if(r){if(e.t==='goal')r.g++;else if(e.t==='pgoal'){r.g++;r.pg++}else if(e.t==='pmiss')r.pm++;else if(e.t==='og')r.og++;else if(e.t==='save')r.on++;else if(e.t==='post')r.post++;else if(e.t==='miss')r.off++;else if(e.t==='tk')r.tk++;else if(e.t==='er')r.er++}
    const a=e.as!=null?R.get(e.as):null;
    if(a){if(e.t==='goal')a.a++;else if(['save','post','miss'].includes(e.t))a.kp++}
    if((e.t==='save'||(e.t==='pmiss'&&e.saved))&&e.gk!=null&&R.get(e.gk))R.get(e.gk).sv++;
  }
  if(res.pk)for(const k of res.pk.kicks){const r=R.get(k.pid);if(r)r.so.push(k.ok)}
  for(const r of R.values()){
    const conc=res.g[1-r.s],won=res.win===r.s,drew=res.win===-1,pk=!!res.pk;
    // 오직 이 경기에서 한 플레이로만 매긴다
    let rt=6+(r.g-r.pg)+r.pg*.7+r.a*.6+r.kp*.15+r.on*.05+r.post*.1-r.off*.05+r.tk*.1-r.er*.15-r.pm*.7-r.og*.8+(won?(pk?.1:.3):drew?0:(pk?-.1:-.3))+rnd(-.2,.3);
    if(r.pos==='GK')rt+=r.sv*.3+(conc===0?.7:-.25*conc);else if(['CB','LB','RB','DM'].includes(r.pos))rt+=conc===0?.5:-.08*conc;
    rt+=r.so.reduce((x,k)=>x+(k?.1:-.3),0);

}
function simulate(A,B,pk,dur){
  dur=dur||50;const kf=50/dur;
  const Tm=[A,B],g=[0,0],ev=[];
  for(let m=1;m<=dur;m++)for(let s=0;s<2;s++){
    const me=Tm[s],op=Tm[1-s];
    const rate=Math.min(.9,kf*.1*Math.pow(me.mid/op.mid,1.4)*Math.pow(me.att/op.def,2.2));
    if(Math.random()<Math.min(.95,.4*kf)){const df=op.ps.filter(x=>x.pos!=='GK');if(df.length){const d=wpick(df,x=>DEF_W[x.pos]*Math.pow(x.e[5]/10+.1,1.5));ev.push({m,s:1-s,t:'tk',sh:d.p.id})}}
    if(Math.random()<.08*kf&&me.ps.length){const c=wpick(me.ps,x=>Math.pow(Math.max(1,16-x.e[0]),1.3)*(x.pos==='GK'?.3:1));ev.push({m,s,t:'er',sh:c.p.id})}
    if(Math.random()<rate){
      if(Math.random()<.025){const tk=me.ps.filter(x=>x.pos!=='GK').sort((x,y)=>y.e[4]-x.e[4])[0];const gk=op.gk;const pr=clamp(.76+(tk.e[4]-(gk?gk.e[6]:4))/40,.5,.92);const ok=Math.random()<pr;if(ok)g[s]++;ev.push({m,s,t:ok?'pgoal':'pmiss',sh:tk.p.id,as:null,gk:gk?gk.p.id:null,saved:!ok&&Math.random()<.65});continue}
      const sh=pickShooter(me),as=Math.random()<.7?pickAssist(me,sh):null;
      const q=(sh.e[4]*.7+sh.e[0]*.3)/10,k=op.gk?op.gk.e[6]/10:.3;
      const p=clamp(.3*q/(.55+.45*k)*Math.sqrt(me.att/op.def),.05,.7);
      const r=Math.random();
      const base={m,s,sh:sh.p.id,as:as?as.p.id:null,gk:op.gk?op.gk.p.id:null};
      if(r<p){g[s]++;if(Math.random()<.04){const d=wpick(op.ps.filter(x=>x.pos!=='GK'),x=>DEF_W[x.pos]+.1);ev.push({...base,t:'og',sh:d.p.id,as:null})}else ev.push({...base,t:'goal'})}
      else if(r<p+.36)ev.push({...base,t:'save'});
      else if(r<p+.43)ev.push({...base,t:'post'});
      else ev.push({...base,t:'miss'});
    }
  }
  let pkr=null,win=g[0]>g[1]?0:g[1]>g[0]?1:-1;
  if(win===-1&&pk){pkr=shootout(A,B);win=pkr.w}
  return {g,ev,pk:pkr,win};
}
function shootout(A,B){
  const ord=[A,B].map(t=>t.ps.filter(x=>x.pos!=='GK').sort((x,y)=>y.e[4]-x.e[4]));
  const gks=[A.gk,B.gk],sc=[0,0],tk=[0,0],kicks=[];
  const kick=s=>{const t=ord[s];const k=t[tk[s]%t.length];const g=gks[1-s];const pr=clamp(.76+(k.e[4]-(g?g.e[6]:4))/40,.45,.93);const ok=Math.random()<pr;tk[s]++;if(ok)sc[s]++;kicks.push({s,pid:k.p.id,ok})};
  const decided=()=>tk[0]<=5&&tk[1]<=5&&(sc[0]+(5-tk[0])<sc[1]||sc[1]+(5-tk[1])<sc[0]);
  for(let r=0;r<5;r++){kick(0);if(decided())break;kick(1);if(decided())break}

}

const INJ=[[3,'타박상',.03],[10,'발목 염좌',.06],[21,'햄스트링 부상',.09],[40,'발목 인대 부분 파열',.12],[60,'무릎 인대 손상',.15]];

function important(p){const h=P(S.hero);return p.id===S.hero||p.id===S.partner||(p.gen===39&&p.room===h.room)}
function dayStart(i){
  T.log=[];T.playedToday=false;

    if(p.inj){p.inj.days--;if(p.inj.days<=0){if(important(p))note(p.id===S.hero?'부상에서 회복했다!':`${p.name} 부상 회복`);p.inj=null}}
    else{let pr=p.prone*clamp(1.8-p.cur[1]/10/12.5,.6,1.8);if(p.id===S.hero&&S.fresh>0)pr*=.5;
      if(Math.random()<pr){injure(p);if(important(p))note(p.id===S.hero?`부상: ${p.inj.type} (${p.inj.days}일)`:`${p.name} 부상: ${p.inj.type} (${p.inj.days}일)`)}}

function makeMatch(comp,A,B,o){return Object.assign({comp,A,B,pk:true,phase:'pre',lu:null,sq:null,hs:-1,min:0,res:null,applied:false},o||{})}

/* 왕중왕전: 누적 점수 상위 6팀. 모자라면 조별리그 승점 합산으로 채우고, 커트라인 동점이면 플레이오프 */
function wjwRank(list){return list.slice().sort((a,b)=>cumPts(b)-cumPts(a)||gpSum(b)-gpSum(a)||Math.random()-.5)}
function seedWjw(){

/* HFL: 1학년 때 반 기준 5팀 리그 → 2위 vs 3위 → 승자 vs 1위 결승 */
function newHfl(){
  const t=shuffle([1,2,3,4,5]);const H={key:'hfl',fx:[],queue:[],stage:'L',places:null,tb:{}};t.forEach(c=>H.tb[c]=Math.random());

  return H;
}
const hflN=c=>`${c}반${c===S.cls?'(우리)':''}`;
function hflLine(f){return `${f.name} ${hflN(f.a)} ${f.s[0]}:${f.s[1]} ${hflN(f.b)}${f.pk?` (승부차기 ${f.pk[0]}:${f.pk[1]})`:''}`}

function recordHfl(f,res){f.ev=res.ev.filter(isScore).map(e=>({m:e.m,s:e.s,t:e.t,sh:e.sh,as:e.as}));f.done=true;f.s=res.g.slice();f.pk=res.pk?res.pk.sc.slice():null;f.w=res.win===0?f.a:f.b;f.l=res.win===0?f.b:f.a;f.day=S.day;checkHfl()}
function runHflBg(f){const res=simBg('hfl',{k:'hflc',cls:f.a},{k:'hflc',cls:f.b},true);recordHfl(f,res)}
function hflTable(){
  const H=S.hfl,R={};[1,2,3,4,5].forEach(c=>R[c]={c,pl:0,w:0,pw:0,pkl:0,l:0,gf:0,ga:0,pts:0});
  const fx=H.fx.filter(f=>f.st==='L'&&f.done);
  for(const f of fx){const a=R[f.a],b=R[f.b];a.pl++;b.pl++;a.gf+=f.s[0];a.ga+=f.s[1];b.gf+=f.s[1];b.ga+=f.s[0];const W=f.w===f.a?a:b,L=f.w===f.a?b:a;if(f.pk){W.pw++;L.pkl++;W.pts+=2;L.pts+=1}else{W.w++;L.l++;W.pts+=3}}
  const arr=Object.values(R).sort((a,b)=>b.pts-a.pts);const out=[];let i=0;
  const h2h=(x,set)=>{let p=0;for(const f of fx){if(!set.has(f.a)||!set.has(f.b))continue;if(f.a!==x.c&&f.b!==x.c)continue;p+=f.w===x.c?(f.pk?2:3):(f.pk?1:0)}return p};
  while(i<arr.length){let j=i;while(j<arr.length&&arr[j].pts===arr[i].pts)j++;const g=arr.slice(i,j);if(g.length>1){const set=new Set(g.map(x=>x.c));g.forEach(x=>x.h=h2h(x,set));g.sort((a,b)=>b.h-a.h||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||H.tb[a.c]-H.tb[b.c])}out.push(...g);i=j}
  return out;
}
function checkHfl(){

  const mk=(st,name,a,b)=>{const f={id:H.fx.length,cup:'hfl',st,name,a,b,done:false,s:null,pk:null,w:null,l:null,day:null};H.fx.push(f);H.queue.push(f.id)};

    note(`HFL 리그 종료. 1위 ${hflN(t[0].c)}는 결승 직행, 2위 ${hflN(t[1].c)} vs 3위 ${hflN(t[2].c)} 플레이오프.`);

  else if(T.screen==='myteam')app.innerHTML=rMyTeam();

function rTop(){

function rStage(){
  if(T.tab!=='today'&&!S.players)return `<div class="card muted">포지션을 정하면 열린다.</div>`;
  if(T.tab==='me')return rMe();
  if(T.tab==='cal')return rCal();
  if(T.tab==='hoju')return rHojuTab();
  if(T.tab==='friends')return rFriends();
  if(T.tab==='report')return rReport();
  if(T.match)return rMatch(T.match);
  const s=T.steps[T.i];if(!s)return '';
  if(s.kind==='script')return rScript(s);
  if(s.kind==='pickPos')return rPick();
  if(s.kind==='hoju')return rHojuStep(s);
  if(s.kind==='hfl')return rHflStep(s);
  if(s.kind==='hflend')return rHflEnd(s);
  if(s.kind==='hjc')return rHjcStep(s);
  if(s.kind==='rank'){const R=S.ev.rank;if(!R)return `<div class="card"><button class="btn pri" data-act="next">계속</button></div>`;return `<div class="card" style="display:grid;gap:10px"><div class="label">호실 순위표 · ${esc(R.by.join(', '))} 작성</div><h2 class="h2">전체 호실 순위 (상반기 기준)</h2><p class="muted" style="margin:0;font-size:13px">상반기 호실축구 성적 50% + 호실 평균 오버롤(상위 11명) 50%</p>${rankCard(R)}<div class="row"><button class="btn pri" data-act="next">계속</button></div></div>`}
  if(s.kind==='match'){T.match=s.m;s.m.stepOwner=true;return rMatch(s.m)}
  if(s.kind==='sports')return rSportsStep(s);
  if(s.kind==='choice')return rChoice(s);
  if(s.kind==='report')return rReportStep(s);
  if(s.kind==='summary')return rSummary(s);
  if(s.kind==='end')return rEnd();
  return '';
}

function rScript(s){
  let ln=s.lines[s.li];
  if(ln.lazy){const L2=ln.lazy==='cap'?(T._cap||[]):[N(`기호 5번에는 ${elecNames()[4]}${hasB(elecNames()[4])?'이':'가'} 나가게 됐다.`)];s.lines.splice(s.li,1,...(L2.length?L2:[N('…')]));ln=s.lines[s.li]}
  for(let k=0;k<=s.li;k++)if(s.lines[k].scene)s.scene=s.lines[k].scene;

}

  const nA=specName(m.A),nB=specName(m.B);
  const head=`<div class="label">${COMP[m.comp]}${m.fx?' · '+m.fx.name:''}${m.mini?' · 6:6 미니축구 10분':''}${m.skey?' · '+SK_NAME[m.skey]:''}${m.pk?'':' · 승부차기 없음'}</div>`;

function showTrophy(){
  T.celeShown=true;const el=document.getElementById('trophy');
  el.querySelector('svg').style.display=T.cele.item?'none':'';
  document.getElementById('trophyTitle').textContent=T.cele.item?`${T.cele.title} 획득!`:`${T.cele.title} 우승!`;
  document.getElementById('trophySub').textContent=T.cele.item?T.cele.sub:`${S.heroName} · 명성 +${T.cele.fame} · ${fmtD(S.day)}`;
  el.hidden=false;el.focus();
  const cv=document.getElementById('confetti');const ctx=cv.getContext('2d');
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const W=cv.width=cv.clientWidth*devicePixelRatio,H=cv.height=cv.clientHeight*devicePixelRatio;
  const cols=['#ffd66b','#ffffff','#6fd393','#7ea9ec','#ee6f63'];
  const ps=Array.from({length:140},()=>({x:Math.random()*W,y:-Math.random()*H,vy:(1.5+Math.random()*3)*devicePixelRatio,vx:(Math.random()-.5)*1.5*devicePixelRatio,r:Math.random()*6,s:(4+Math.random()*6)*devicePixelRatio,c:cols[Math.floor(Math.random()*cols.length)]}));
  const tick=()=>{ctx.clearRect(0,0,W,H);for(const p of ps){p.y+=p.vy;p.x+=p.vx;p.r+=.08;if(p.y>H)p.y=-10;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}confT=requestAnimationFrame(tick)};
  cancelAnimationFrame(confT);tick();
}

    if(t.dataset.chg==='mtSlot'){const T0=mtLineup();const i=+t.dataset.k;const v=t.value?+t.value:null;const ids=T0.ids.slice();const j=ids.findIndex((x,k)=>k!==i&&x===v&&v!=null);if(j>=0)ids[j]=ids[i]??null;ids[i]=v;LS.set(MTL_KEY,{form:T0.form,ids});render();return}
    const m=T.match;if(!m||!t.dataset.chg)return;const hs=m.hs;
    if(t.dataset.chg==='form'){S.myForm=t.value;m.lu[hs]=fillLineup(m.sq[hs].map(P),t.value,remapForm(m.lu[hs],t.value),{senior:HCUP(m.comp)})}
    if(t.dataset.chg==='slot'){const i=+t.dataset.k,pid=+t.value,sl=m.lu[hs].slots;const j=sl.findIndex((s,k)=>k!==i&&s.pid===pid);if(j>=0)sl[j].pid=sl[i].pid;sl[i].pid=pid}
    render();
  });
  render();
}
</script>

<script>
/* ===================== 뮤됴구: 전체 기록 옮기기 =====================
   리포트 슬롯 3칸 + MY TEAM + 라인업을 코드 하나로 만들고, 다른 곳(사이트/다른 기기)에서
   붙여넣어 그대로 옮긴다. 원본 코드는 건드리지 않고 타이틀 화면 카드에 칸만 덧붙인다. */
(function(){
  var KEYS=[SLOT_KEY, MT_KEY, MTL_KEY];
  var PREFIX='MUDX1|hanilnam-life|';
  function b64e(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
  function b64d(t){var s=atob(t),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b)}
  function nonEmpty(v){ if(v==null)return false; try{var o=JSON.parse(v); if(Array.isArray(o))return o.some(Boolean); if(o&&typeof o==='object')return Object.keys(o).length>0 && !(k0(o)); return !!o;}catch(e){return false} }
  function k0(o){ return o.form && Array.isArray(o.ids) && o.ids.length===0; }   // 빈 라인업
  function hasLocal(){ try{ return KEYS.some(function(k){return nonEmpty(localStorage.getItem(k))}); }catch(e){return false} }
  function allCode(){
    var keys={};
    KEYS.forEach(function(k){ try{ var v=localStorage.getItem(k); if(v!=null) keys[k]=v; }catch(e){} });
    return PREFIX+b64e(JSON.stringify({v:1,at:Date.now(),keys:keys}));
  }
  function parse(code){
    var raw=String(code||'').replace(/\s+/g,'');
    if(raw.indexOf(PREFIX)!==0) return null;
    var o=JSON.parse(b64d(raw.slice(PREFIX.length)));
    return (o&&o.keys&&typeof o.keys==='object')?o.keys:null;
  }
  function bestRecord(){
    var L=mtList(), best=null, bs=-1;
    L.forEach(function(r){ var st=r.st||{}; var sc=(parseFloat(r.ovr)||0)*10+(r.fame||0)*2+(st.w||0)*3; if(sc>bs){bs=sc;best=r;} });
    return best;
  }
  function applyAll(code,opts){
    opts=opts||{};
    var keys; try{ keys=parse(code); }catch(e){ keys=null; }
    if(!keys) return false;
    // 합치기 (아무것도 잃지 않게)
    //  · 리포트 슬롯: 가져온 쪽에 있는 칸은 가져온 것으로, 비어 있는 칸은 이 기기 것을 그대로
    //    (둘 다 들어 있는 칸이 있으면 한 번 물어봄)
    //  · MY TEAM: 두 쪽 선수를 모두 (같은 선수는 한 명만), 최신순 최대 20명
    //  · 라인업: 가져온 라인업에 선수가 있으면 그것으로
    function J(v,d){ try{ var o=JSON.parse(v); return o==null?d:o; }catch(e){ return d; } }
    var lSl=J(localStorage.getItem(SLOT_KEY),[null,null,null]), iSl=J(keys[SLOT_KEY],[null,null,null]);
    var clash=[0,1,2].filter(function(k){ return lSl[k]&&iSl[k]&&JSON.stringify(lSl[k])!==JSON.stringify(iSl[k]); });
    if(!opts.silent && clash.length && !confirm('리포트 슬롯 '+clash.map(function(k){return k+1}).join(', ')+'번이 양쪽에 다 있어요.\n가져온 리포트로 바꿀까요? (취소하면 이 기기 리포트를 남겨요)')) clash.forEach(function(k){ iSl[k]=null; });
    var mSl=[0,1,2].map(function(k){ return iSl[k]||lSl[k]||null; });
    var lMt=J(localStorage.getItem(MT_KEY),[]), iMt=J(keys[MT_KEY],[]);
    var seen={}, mMt=[];
    iMt.concat(lMt).forEach(function(r){ if(!r)return; var id=(r.id!=null)?('i'+r.id):JSON.stringify(r); if(seen[id])return; seen[id]=1; mMt.push(r); });
    mMt.sort(function(a,b){ return (b.id||0)-(a.id||0); }); mMt=mMt.slice(0,20);
    var iLu=J(keys[MTL_KEY],null), lLu=J(localStorage.getItem(MTL_KEY),null);
    var mLu=(iLu&&Array.isArray(iLu.ids)&&iLu.ids.some(Boolean))?iLu:lLu;
    try{ localStorage.setItem(SLOT_KEY,JSON.stringify(mSl)); localStorage.setItem(MT_KEY,JSON.stringify(mMt)); if(mLu)localStorage.setItem(MTL_KEY,JSON.stringify(mLu)); }catch(e){ return false; }
    try{ var b=bestRecord(); if(b&&typeof mudyoguSync==='function') mudyoguSync(b); }catch(e){}
    try{ if(typeof mudPushCode==='function') mudPushCode(); }catch(e){}
    try{ if(typeof stopTimer==='function')stopTimer(); T.screen='title'; if(!opts.silent)T.msg='전체 기록을 불러왔다.'; render(); }catch(e){}
    return true;
  }
  window.mudAllCode=allCode; window.mudApplyAll=applyAll; window.mudHasLocal=hasLocal;

  // 리포트 슬롯 저장 · MY TEAM · 라인업이 바뀔 때마다 앱 계정의 코드도 최신으로 (1초 모아서)
  var pushT=null, origSet=LS.set;
  LS.set=function(k,v){ var r=origSet.apply(LS,arguments); if(KEYS.indexOf(k)>=0){ clearTimeout(pushT); pushT=setTimeout(function(){ try{ mudPushCode(); }catch(e){} },1000); } return r; };

  // ── 타이틀 화면 '저장된 리포트' 카드에 칸 덧붙이기 ──
  function inject(){
    var logo=document.querySelector('#app .logo .life'); if(!logo) return;
    var card=document.querySelector('#app section.card'); if(!card||card.querySelector('#mudAll')) return;
    var d=document.createElement('details'); d.id='mudAll'; d.style.marginTop='8px';
    d.innerHTML='<summary class="muted" style="cursor:pointer">전체 기록 옮기기 (다른 기기 · 사이트로)</summary>'+
      '<div style="display:grid;gap:8px;margin-top:8px">'+
      '<p class="muted" style="margin:0;font-size:13px">리포트 슬롯과 MY TEAM 전체를 코드 하나로 옮긴다. 옮길 곳의 같은 칸에 붙여넣으면 된다.</p>'+
      '<textarea id="mudAllOut" readonly></textarea>'+
      '<div class="row"><button class="btn sm" id="mudAllCopy">코드 복사</button></div>'+
      '<textarea id="mudAllIn" placeholder="옮겨온 전체 기록 코드를 붙여넣기"></textarea>'+
      '<div class="row"><button class="btn sm" id="mudAllApply">불러오기</button><span class="err" id="mudAllMsg"></span></div></div>';
    card.appendChild(d);
    var out=d.querySelector('#mudAllOut'), msg=d.querySelector('#mudAllMsg');
    d.addEventListener('toggle',function(){ if(d.open) out.value=allCode(); });
    d.querySelector('#mudAllCopy').addEventListener('click',function(){
      out.value=allCode(); try{ mudPushCode(); }catch(e){}
      navigator.clipboard.writeText(out.value).then(function(){ msg.textContent='코드를 복사했다.'; })
        .catch(function(){ out.select(); msg.textContent='자동 복사가 안 돼서 코드를 선택해 뒀다. 직접 복사해줘.'; });
    });
    d.querySelector('#mudAllApply').addEventListener('click',function(){
      var v=d.querySelector('#mudAllIn').value;
      if(!v.trim()){ msg.textContent='코드를 붙여넣어줘.'; return; }
      if(!applyAll(v)){ msg.textContent='코드를 읽지 못했다. 처음부터 끝까지 빠짐없이 붙여넣었는지 확인해줘.'; }
    });
  }
  var origRender=render;
  render=function(){ var r=origRender.apply(this,arguments); try{ inject(); }catch(e){} return r; };
  try{ inject(); }catch(e){}

  // 앱(사이트) 안이면, 이미 있는 기록을 계정에 한 번 보관
  setTimeout(function(){ try{ mudPushCode(); }catch(e){} },1500);
})();
</script>
<script>
/* ===================== 뮤됴구: 버그 수정 (원본 함수를 감싸서 고침) =====================
   1) 마지막 주(12/24~)에는 주인공이 새로 다치지 않는다. 엔딩에서는 주인공 부상을 지워
      최종 오버롤·39기 순위가 부상 없는 상태로 나온다.
   2) '친구와 시간' 멤버가 오늘 칸 ↔ 다른 칸을 오갈 때마다 바뀌던 버그.
      rChoice() 가 그릴 때마다 ctxNow() 로 룸메이트·선배를 무작위로 다시 뽑았음 → 하루 동안 고정.
   3) 엔딩 화면이 뜨자마자 MY TEAM 에 자동 등록되던 버그 (저장 안 하고 나가면 12/29 로
      돌아가 같은 캐릭터를 몇 번이고 다시 등록 가능). → 엔딩 뒤 '리포트 저장'(슬롯 저장)을
      눌렀을 때만 등록. 같은 1학년 기록은 한 번만 (슬롯 저장 때 붙이는 runId 로 중복 제거). */
(function lifeFixes(){
  if (typeof dayStart !== 'function' || typeof rEnd !== 'function') return;
  var LAST_WEEK = END - 6;   // 12월 24일

  // 1) 마지막 주 부상 금지 + 엔딩 때 부상 지우기
  var origDayStart = dayStart;
  dayStart = function (i) {
    var h = S && S.players && P(S.hero);
    if (!h || i < LAST_WEEK) return origDayStart.apply(this, arguments);
    var prone = h.prone; h.prone = 0;
    try { return origDayStart.apply(this, arguments); } finally { h.prone = prone; }
  };

  // 2) 친구와 시간: 하루 동안 같은 멤버
  var origRChoice = rChoice;
  rChoice = function () {
    var origCtx = ctxNow;
    var key = S.day + ':' + S.hero;
    if (!T.mudFr || T.mudFr.key !== key) T.mudFr = { key: key, c: origCtx() };
    ctxNow = function () { return T.mudFr.c; };
    try { return origRChoice.apply(this, arguments); } finally { ctxNow = origCtx; }
  };

  // 3) MY TEAM 은 엔딩 뒤 리포트 저장 때만
  var origSaveMyTeam = saveMyTeam;
  var allowMT = false;
  saveMyTeam = function () {
    if (!allowMT || !S.ended || S.mtSaved) return;
    origSaveMyTeam.apply(this, arguments);
    var L = mtList();
    if (L[0]) {
      L[0].runId = S.runId;
      L = L.filter(function (r, k) { return k === 0 || r.runId !== S.runId; });
      LS.set(MT_KEY, L.slice(0, 20));
    }
  };

  var origREnd = rEnd;
  rEnd = function () {
    var h = P(S.hero);
    if (h && h.inj) h.inj = null;
    var html = origREnd.apply(this, arguments);
    var msg = T.mtFail ? '이 브라우저에서는 MY TEAM에 저장할 수 없었다.'
            : S.mtSaved ? '이번 1학년 기록이 MY TEAM에 등록됐다. 처음 화면에서 언제든 다시 볼 수 있다.'
            : '아래 <b>리포트 저장</b>에서 슬롯에 저장하면 MY TEAM에도 등록된다. 저장하지 않고 나가면 기록이 남지 않는다.';
    return html.replace(/이 브라우저에서는 MY TEAM에 저장할 수 없었다\.|이번 1학년 기록이 MY TEAM에 저장됐다\. 처음 화면에서 언제든 다시 볼 수 있다\./, msg);
  };

  var origSaveSlot = ACT.saveSlot;
  ACT.saveSlot = function (el) {
    // 중간 저장에도 runId 를 붙여 둔다 → 12/29 슬롯을 불러와 다시 끝내도 같은 기록으로 취급(덮어씀)
    if (S.players && !S.runId) S.runId = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    if (S.ended && !S.mtSaved) {
      allowMT = true;
      try { saveMyTeam(); } finally { allowMT = false; }
    }
    return origSaveSlot.apply(this, arguments);
  };
})();

/* ===================== 뮤됴구: 포지션 적합도 · 전술 추가 (사용자 요청) =====================
   - CM ↔ DM 은 사실상 같은 자리 → 능력 감소 8% → 2% (적합도 .92 → .98).
     서브 포지션(.95)보다 가까운 자리가 더 높으면 높은 쪽을 쓴다 (CM 선수에게 DM 이 서브로 있어도 .98).
   - 전술 3-5-2 · 3-4-3 · 3-4-2-1 추가 (경기 라인업 · 상대 팀 · MY TEAM 모두). 윙백은 LB/RB. */
(function lifeTactics(){
  if (typeof CLOSE === 'undefined' || typeof FORMS === 'undefined' || typeof fit !== 'function') return;
  CLOSE['DM-CM'] = .98;
  var origFit = fit;
  fit = function (p, pos) {
    var v = origFit(p, pos);
    if (v >= 1 || pos === 'GK' || p.pos === 'GK') return v;
    return Math.max(v, closeness(p.pos, pos));
  };
  [
    {id:'3-5-2',s:[['GK',50,90],['CB',30,76],['CB',50,79],['CB',70,76],['LB',10,47],['CM',30,48],['DM',50,57],['CM',70,48],['RB',90,47],['ST',36,16],['ST',64,16]]},
    {id:'3-4-3',s:[['GK',50,90],['CB',30,76],['CB',50,79],['CB',70,76],['LB',10,50],['CM',37,53],['CM',63,53],['RB',90,50],['LW',17,25],['ST',50,14],['RW',83,25]]},
    {id:'3-4-2-1',s:[['GK',50,90],['CB',30,76],['CB',50,79],['CB',70,76],['LB',10,52],['CM',37,56],['CM',63,56],['RB',90,52],['AM',33,33],['AM',67,33],['ST',50,14]]}
  ].forEach(function (f) {
    if (FORMS.some(function (x) { return x.id === f.id; })) return;
    FORMS.push({ id: f.id, slots: f.s.map(function (a) { return { pos: a[0], x: a[1], y: a[2] }; }) });
  });
})();

/* ===================== 뮤됴구: 엔터키로 대화 넘기기 =====================
   원본은 대화창을 클릭하거나, 대화창에 포커스가 있을 때만 엔터가 먹었다.
   → 어디서든 엔터를 누르면 지금 대화를 다음 줄로 넘긴다.
   · 선택지가 떠 있는 줄(.dlg.lock)은 넘기지 않음 (선택지는 직접 고르기)
   · 이름 입력칸·코드 칸·버튼 등에 포커스가 있으면 원래 동작 그대로
   · 꾹 누르고 있을 때 연달아 넘어가지 않게 키 반복은 무시 */
(function enterToAdvance(){
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.repeat || e.isComposing) return;
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var t = e.target;
    if (t && t.closest && t.closest('input, textarea, select, button, a, [contenteditable], [data-act][role="button"]')) return;
    var dlg = document.querySelector('.dlg[data-act="line"]');
    if (!dlg) return;
    e.preventDefault();
    dlg.click();
  });
})();

/* ===================== 뮤됴구: 화면 맞춤 (앱 안에서만) =====================
   원본 모양은 그대로 두고 페이지 전체를 '약간' 축소해서
   첫 화면(타이틀)이 창 높이에 딱 맞게 한다. 다른 화면도 같은 비율을 쓰고,
   그보다 긴 화면은 지금처럼 아래로 스크롤된다.
   · 딱 맞는 크기보다 8% 크게 (최대 1.08배, 첫 화면 아래가 살짝 스크롤됨) · 최소 0.6배
   · 폰 세로 화면(폭 700px 미만)에서는 축소하지 않는다 (글씨가 너무 작아짐)
   · 브라우저 확대 배율은 빼고 계산 → Ctrl + 로 확대하면 그만큼 커지고 아래로 스크롤 */
(function fitToScreen(){
  if (new URLSearchParams(location.search).get('mudEmbed') !== '1') return;
  var root = document.documentElement;
  var titleH = 0;
  function onTitle(){ return !!document.querySelector('#app .logo .life'); }
  // 브라우저 확대(Ctrl +/-) 배율. 이걸 모르면 확대할수록 게임이 스스로 줄어들어
  // 150% 까지는 크기가 그대로이다가 폭 700 밑으로 가는 순간 갑자기 커졌다.
  // 크롬은 outerWidth 가 확대와 무관하므로 outer/inner 비율 = 확대 배율 (마우스/터치패드 기기만)
  function browserZoom() {
    try {
      if (!window.matchMedia('(pointer: fine)').matches) return 1;
      var t = window.top, r = t.outerWidth / t.innerWidth;
      if (!(r > 0) || Math.abs(r - 1) < 0.1) return 1;
      return Math.min(3, Math.max(0.3, r));
    } catch (e) { return 1; }
  }
  var BOOST = 1.08;   // 첫 화면이 창에 딱 맞는 크기보다 8% 크게 (사용자 요청: "조금만 더 키우자")
  function fit(){
    var bz = browserZoom();
    if (window.innerWidth * bz < 700) { root.style.zoom = ''; return; }
    if (onTitle() || !titleH) {
      root.style.zoom = '1';
      titleH = root.scrollHeight || window.innerHeight;
    }
    var z = Math.min(BOOST, Math.max(0.6, (window.innerHeight * bz - 2) / titleH * BOOST));
    root.style.zoom = String(Math.floor(z * 1000) / 1000);
  }
  var queued = false;
  function schedule(){
    if (queued) return; queued = true;
    requestAnimationFrame(function(){ queued = false; fit(); });
  }
  var app = document.getElementById('app');
  if (app) new MutationObserver(schedule).observe(app, { childList: true });
  window.addEventListener('resize', schedule);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
  window.addEventListener('load', schedule);
  window.mudyoguFit = fit;
  schedule();
})();
</script>

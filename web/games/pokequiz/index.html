<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>실루엣 인카운터</title>
<!-- 뮤됴구: 오프라인용 로컬 폰트 / 라이브러리 (원본은 Google Fonts, cdnjs peerjs 1.5.4) -->
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vendor/peerjs.min.js"></script>
<style>
  :root{
    --bg0:#160e2b; --bg1:#241546; --bg2:#341c63;
    --panel:#2a1a4e; --panel2:#372159; --line:#4a2f7a;
    --ink:#f1ecff; --mute:#a99ad2; --faint:#7c6aa6;
    --red:#ff5470; --gold:#ffce5c; --mint:#5ce0c0; --violet:#9d7bff;
    --ok:#57e39a; --bad:#ff6b81;
    --disp:"Black Han Sans", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body:"Gothic A1", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono:"Space Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body); color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, var(--bg2) 0%, var(--bg1) 45%, var(--bg0) 100%);
    background-attachment:fixed;
    min-height:100dvh; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;min-height:100dvh;padding:22px 18px 34px;position:relative;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.on{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
  .brand b{color:var(--mint);font-weight:700}
  .dot-sep{width:5px;height:5px;border-radius:50%;background:var(--line)}

  /* ---------- HOME ---------- */
  #home{justify-content:center;align-items:center;text-align:center;gap:0}
  .orb-wrap{position:relative;width:190px;height:190px;margin:6px 0 26px;display:grid;place-items:center}
  .orb{
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #40265f 0%, #241241 60%, #150a2a 100%);
    border:2px solid var(--line);
    display:grid;place-items:center;
    box-shadow:0 0 60px -12px var(--violet), inset 0 0 40px -10px #000;
    position:relative;z-index:2;
  }
  .orb .q{font-family:var(--disp);font-size:74px;color:var(--gold);text-shadow:0 0 26px rgba(255,206,92,.55);opacity:.92}
  .ring{position:absolute;border-radius:50%;border:1.5px solid var(--violet);opacity:.0}
  .ring.r1{width:150px;height:150px;animation:pulse 3.2s ease-out infinite}
  .ring.r2{width:150px;height:150px;animation:pulse 3.2s ease-out infinite 1.6s}
  @keyframes pulse{0%{opacity:.55;transform:scale(1)}80%{opacity:0;transform:scale(1.55)}100%{opacity:0}}
  .scan{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:3;pointer-events:none}
  .scan::after{content:"";position:absolute;left:-20%;right:-20%;height:2px;top:0;
    background:linear-gradient(90deg,transparent,var(--mint),transparent);
    filter:drop-shadow(0 0 6px var(--mint));animation:sweep 2.6s linear infinite}
  @keyframes sweep{0%{top:12%}100%{top:88%}}

  h1.title{font-family:var(--disp);font-size:clamp(38px,12vw,56px);line-height:.98;letter-spacing:.01em}
  h1.title .l1{color:var(--ink)}
  h1.title .l2{color:var(--red);text-shadow:0 0 30px rgba(255,84,112,.4)}
  .tag{margin-top:14px;color:var(--mute);font-size:14.5px;line-height:1.5;max-width:300px}
  .tag b{color:var(--gold);font-weight:700}

  .home-btns{width:100%;max-width:330px;margin-top:34px;display:flex;flex-direction:column;gap:12px}
  .btn{font-family:var(--body);font-weight:900;font-size:18px;border:none;border-radius:16px;padding:17px 20px;cursor:pointer;transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;color:#20103a}
  .btn:active{transform:translateY(2px) scale(.99)}
  .btn.primary{background:linear-gradient(135deg,#ff6a84,var(--red));color:#fff;box-shadow:0 12px 30px -12px var(--red)}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
  .btn.ghost .k{color:var(--mint)}
  .foot{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint)}

  /* ---------- TOPBAR (quiz/dex) ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.corner-btn{position:absolute;top:14px;right:14px;z-index:30;background:#ffffff10;border:1px solid #ffffff22;color:var(--mute);font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(4px)}
.corner-btn:hover{background:#ffffff1c;color:var(--ink)}
.corner-btn.left{left:14px;right:auto}
.tk-count{text-align:center;font-size:15px;color:var(--mute);margin-bottom:8px}
.tk-count b{font-family:var(--disp);font-size:22px;color:var(--gold)}
.scout-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto}
.scout-type{background:#ffffff08;border:1.5px solid #ffffff18;color:var(--ink);font-weight:700;font-size:13px;padding:11px 4px;border-radius:12px;cursor:pointer;transition:all .15s}
.scout-type:hover{border-color:var(--tc);color:var(--tc)}
.scout-type.sel{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:0 6px 16px -8px var(--tc)}
.scr-title{font-family:var(--disp);font-size:18px;font-weight:800;color:var(--ink)}
.prof-card,.stat-card{background:#ffffff08;border:1px solid #ffffff14;border-radius:16px;padding:16px;margin-bottom:14px}
.prof-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.prof-row+.prof-row{border-top:1px solid #ffffff10}
.prof-lbl{font-size:12px;color:var(--mute);font-weight:700}
.prof-code{font-family:var(--mono);font-size:18px;font-weight:800;letter-spacing:3px;color:var(--gold)}
.nick-wrap{display:flex;gap:6px;align-items:center}
.nick-in{background:#0e0a1e;border:1px solid #ffffff22;border-radius:8px;color:var(--ink);padding:6px 10px;font-size:14px;width:120px;text-align:right}
.stat-card{text-align:center}
.stat-big{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--ink)}
.stat-big b{color:var(--gold)}
.stat-sub{font-size:12px;color:var(--mute);margin-top:2px}
.rec-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.rec-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#ffffff06;border:1px solid #ffffff10;border-radius:10px;padding:9px 12px}
.rec-res{font-weight:800;font-size:13px;width:20px;text-align:center;border-radius:6px}
.rec-res.win{color:#5ac8fa}.rec-res.loss{color:#e0708a}
.rec-opp{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-sr{color:var(--faint);font-size:11px}
.rec-date{font-size:11px;color:var(--faint);font-family:var(--mono)}
  .iconbtn{background:var(--panel);border:1.5px solid var(--line);color:var(--ink);width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer;display:grid;place-items:center;transition:filter .2s}
  .iconbtn:active{filter:brightness(1.3)}
  .lives{display:flex;gap:7px;align-items:center}
  .life{width:15px;height:15px;border-radius:50%;background:#3a2560;border:1.5px solid var(--line);transition:all .25s}
  .life.on{background:radial-gradient(circle at 35% 30%,#ff8a9e,var(--red));border-color:var(--red);box-shadow:0 0 10px -1px var(--red)}
  .streak{font-family:var(--mono);font-size:12px;color:var(--mute)}
  .streak b{color:var(--gold)}

  /* ---------- QUIZ CARD ---------- */
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1.5px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:0 20px 50px -30px #000;position:relative}
  .ribbon{position:absolute;top:-13px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;
    font-family:var(--body);font-weight:900;font-size:12.5px;letter-spacing:.02em;color:#3a2200;
    background:linear-gradient(135deg,#ffe08a,var(--gold));padding:6px 15px 7px;border-radius:999px;white-space:nowrap;
    box-shadow:0 6px 18px -6px var(--gold),0 0 0 3px #2a1a4e;z-index:6}
  .ribbon.on{display:inline-flex;animation:ribbonIn .5s cubic-bezier(.2,1.4,.4,1)}
  .ribbon::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:10px;height:10px;background:var(--gold);border-radius:2px;z-index:-1}
  @keyframes ribbonIn{from{transform:translateX(-50%) translateY(-8px) scale(.6);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
  .caption{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .caption .bar{height:1px;flex:1;background:var(--line)}

  /* mystery reveal head */
  .head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .mini-orb{width:96px;height:96px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 35% 30%,#3a235c,#1c0f36);border:1.5px solid var(--line);overflow:hidden}
  .mini-orb .qm{font-family:var(--disp);font-size:46px;color:var(--gold);opacity:.9}
  .mini-orb img{width:100%;height:100%;object-fit:contain;padding:6px;display:none;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .head-meta{flex:1;min-width:0}
  .head-name{font-family:var(--disp);font-size:26px;letter-spacing:.02em;color:var(--faint)}
  .head-name.revealed{color:var(--ink)}
  .total-line{font-family:var(--mono);font-size:12.5px;color:var(--mute);margin-top:3px}
  .total-line b{color:var(--mint);font-size:15px}

  /* stats */
  .stats{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .stat{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:10px}
  .stat .lbl{font-size:12.5px;color:var(--mute);font-weight:700}
  .stat .track{height:12px;background:#1e1338;border-radius:7px;overflow:hidden;border:1px solid #ffffff10}
  .stat .fill{height:100%;border-radius:7px;width:0;background:linear-gradient(90deg,#4fd6c9,#7ef0a8);transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .stat .num{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink)}

  /* hint chips */
  .hints{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .hint-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;background:#ffffff08;border:1px dashed var(--line);transition:all .3s}
  .hint-row.locked{opacity:.5}
  .hint-row.unlocked{border-style:solid;border-color:var(--gold);background:linear-gradient(90deg,#ffce5c14,#ffffff08);animation:fade .4s ease}
  .hint-key{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;width:56px;flex:none}
  .hint-row.locked .hint-key{color:var(--faint)}
  .hint-val{flex:1;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:15px}
  .lockmsg{color:var(--faint);font-size:13px;font-style:italic}
  .type-chip{padding:5px 13px;border-radius:999px;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 2px #0004}
  .type-chip.hidden{background:#3a2560!important;color:var(--faint);text-shadow:none;border:1px dashed var(--line)}
  .gen-badge{font-family:var(--mono);font-weight:700;background:var(--violet);color:#160e2b;padding:5px 14px;border-radius:8px;font-size:14px}
  .evo-badge{font-family:var(--body);font-weight:900;font-size:14px;color:#160e2b;background:linear-gradient(135deg,#ffe08a,var(--gold));padding:6px 15px;border-radius:8px}

  /* input */
  .guess-wrap{margin-top:16px;position:relative}
  .guess-row{display:flex;gap:9px}
  #guess{flex:1;font-family:var(--body);font-weight:700;font-size:16px;padding:15px 16px;border-radius:14px;background:#160e2b;border:1.5px solid var(--line);color:var(--ink);outline:none;transition:border-color .2s}
  #guess:focus{border-color:var(--mint)}
  #guess::placeholder{color:var(--faint);font-weight:400}
  .go{background:linear-gradient(135deg,#ff6a84,var(--red));color:#fff;border:none;border-radius:14px;padding:0 20px;font-family:var(--body);font-weight:900;font-size:16px;cursor:pointer;flex:none}
  .go:active{transform:translateY(2px)}
  .go:disabled{filter:grayscale(.6) brightness(.7);cursor:default}
  .suggest{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:#1d1238;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 -14px 40px -20px #000;display:none;z-index:5}
  .suggest.on{display:block}
  .sug{padding:12px 15px;font-weight:700;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff0d}
  .sug:last-child{border-bottom:none}
  .sug:hover,.sug.active{background:var(--panel2)}
  .sug .id{font-family:var(--mono);font-size:11px;color:var(--faint)}

  .feedback{margin-top:13px;min-height:22px;text-align:center;font-weight:700;font-size:14.5px}
  .feedback.bad{color:var(--bad)}
  .feedback.ok{color:var(--ok)}
  .feedback.neutral{color:var(--mute)}

  /* result overlay actions */
  .result-actions{margin-top:18px;display:none;gap:11px;flex-direction:column}
  .result-actions.on{display:flex}
  .result-line{text-align:center;font-family:var(--disp);font-size:22px;margin-bottom:2px}
  .result-line.win{color:var(--ok)}
  .result-line.lose{color:var(--bad)}
  .answer-detail{text-align:center;color:var(--mute);font-size:13.5px;font-family:var(--mono)}

  /* ---------- DEX ---------- */
  #dex .card{padding:16px 15px}
  .dex-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .dex-title{font-family:var(--disp);font-size:26px}
  .dex-count{font-family:var(--mono);font-size:12px;color:var(--mute)}
  .dex-count b{color:var(--mint)}
  #dexSearch{width:100%;font-family:var(--body);font-weight:600;font-size:15px;padding:13px 15px;border-radius:13px;background:#160e2b;border:1.5px solid var(--line);color:var(--ink);outline:none;margin-bottom:14px}
  #dexSearch:focus{border-color:var(--mint)}
  .dex-tabs{display:flex;gap:6px;background:#160e2b;border:1.5px solid var(--line);border-radius:13px;padding:4px;margin-bottom:14px}
  .dex-tab{flex:1;border:none;background:transparent;color:var(--mute);font-family:var(--body);font-weight:800;font-size:13.5px;padding:9px 6px;border-radius:9px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .dex-tab .cnt{font-family:var(--mono);font-size:11px;opacity:.8}
  .dex-tab.on{background:linear-gradient(135deg,#ff6a84,var(--red));color:#fff;box-shadow:0 6px 16px -8px var(--red)}
  .dex-tab:not(.on):active{background:var(--panel2)}
  .dex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .dex-mv-btn{position:absolute;bottom:7px;right:7px;background:#5b8cff26;border:1px solid #5b8cff66;color:#a8c0ff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;cursor:pointer;z-index:5}
  .dex-mv-btn:hover{background:#5b8cff44;color:#fff}
  .ms-modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(3px)}
  .ms-modal.on{display:flex}
  .ms-box{background:#160e2b;border:1px solid #ffffff22;border-radius:16px;padding:18px;max-width:430px;width:100%;max-height:82vh;overflow:auto;box-shadow:0 20px 60px -10px #000}
  .ms-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:800;font-size:17px;color:var(--ink);margin-bottom:6px}
  .ms-no{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
  .ms-head button{background:none;border:none;color:var(--mute);font-size:20px;cursor:pointer;line-height:1}
  .ms-ab{font-size:12px;color:var(--mute);margin-bottom:8px}.ms-ab b{color:var(--gold)}
  .ms-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #ffffff12}
  .ms-n{font-weight:700;color:var(--ink);font-size:14px}
  .ms-meta{font-family:var(--mono);font-size:10px;color:var(--mute);margin-left:auto;text-align:right}
  .mon{background:#ffffff08;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;position:relative;overflow:hidden}
  .mon.caught{border-color:var(--mint);background:linear-gradient(180deg,#5ce0c012,#ffffff08)}
  .mon .mid{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .mon .mname{font-family:var(--disp);font-size:18px;margin:2px 0 6px;line-height:1}
  .mon.uncaught .mname{color:var(--faint)}
  .mon .mtypes{display:flex;gap:5px;flex-wrap:wrap}
  .mon .tt{font-size:11px;font-weight:900;color:#fff;padding:2px 9px;border-radius:999px;text-shadow:0 1px 2px #0004}
  .mon .mstat{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:7px}
  .mon .caught-badge{position:absolute;top:8px;right:8px;color:var(--mint);font-size:13px}
  .mon .gtag{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.08em}
  .dex-empty{grid-column:1/-1;text-align:center;color:var(--faint);padding:30px 0;font-size:14px}

  /* ---------- BATTLE ---------- */
  .btn.locked{opacity:.6;filter:grayscale(.4)}
  #battleBtn .prog{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--faint);margin-top:3px;letter-spacing:.06em}
  .bt-head{text-align:center;margin-bottom:14px}
  .bt-title{font-family:var(--disp);font-size:24px}
  .bt-sub{color:var(--mute);font-size:13px;margin-top:4px}
  .who{display:inline-flex;align-items:center;gap:6px;font-weight:900;color:#fff;padding:4px 12px;border-radius:999px;font-size:13px}
  .tag-p1{background:linear-gradient(135deg,#ff6a84,var(--red))} .tag-p2{background:linear-gradient(135deg,#5f9bff,#3b6fe0)}
  .mv-enclock{opacity:.45}
  .draft-empty{grid-column:1/-1;text-align:center;padding:24px;color:rgba(255,255,255,.5)}
  .draft-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 6px}
  .draft-mon{position:relative;background:#ffffff08;border:2px solid var(--line);border-radius:14px;padding:9px 8px;cursor:pointer;transition:all .15s;text-align:center}
  .draft-mon.sel{border-color:var(--gold);background:linear-gradient(180deg,#ffce5c1a,#ffffff08);box-shadow:0 0 0 3px #ffce5c22}
  .draft-mon .dm-name{font-family:var(--disp);font-size:15px;line-height:1.05;margin-bottom:5px}
  .draft-mon .dm-types{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-bottom:5px}
  .draft-mon .tt{font-size:9.5px;font-weight:900;color:#fff;padding:1px 6px;border-radius:999px}
  .draft-mon .dm-bst{font-family:var(--mono);font-size:10px;color:var(--mute)}
  .draft-search{width:100%;max-width:420px;margin:0 auto 14px;display:block;padding:11px 15px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:15px;font-family:inherit;box-sizing:border-box}
  .draft-search::placeholder{color:rgba(255,255,255,.5)}
  .draft-search:focus{outline:none;border-color:var(--gold)}
  .draft-mon .pick-no{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#160e2b;font-weight:900;font-size:12px;display:none;align-items:center;justify-content:center}
  .draft-mon.sel .pick-no{display:flex}
  .handoff{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
  .handoff .ho-ico{font-size:54px}
  .handoff .ho-msg{font-family:var(--disp);font-size:24px}
  .handoff .ho-sub{color:var(--mute);font-size:14px;max-width:270px;line-height:1.5}

<div id="app">

  <section id="records" class="screen"><div id="recview"></div></section>

  <!-- ===================== QUIZ ===================== -->

        </div>

      </div>

      <div class="guess-wrap">
        <div class="suggest" id="suggest"></div>
        <div class="guess-row">
          <input id="guess" type="text" autocomplete="off" placeholder="포켓몬 이름 입력…" oninput="onType()" onkeydown="onKey(event)">
          <button class="go" id="goBtn" onclick="submitTop()">확인</button>
        </div>
      </div>

      <div class="feedback neutral" id="feedback">종족값을 보고 추리해 보세요.</div>

      <div class="result-actions" id="resultActions">
        <button class="btn primary" onclick="startQuiz()">다음 포켓몬</button>
        <button class="btn ghost" onclick="goHome()">홈으로</button>
      </div>
    </div>
  </section>

  <!-- ===================== DEX ===================== -->
  <section id="dex" class="screen">
    <div class="topbar">
      <button class="iconbtn" onclick="goHome()">‹</button>
      <div class="brand"><b>POKÉDEX</b><span class="dot-sep"></span>GEN 1–9</div>
      <div style="width:42px"></div>
    </div>
    <div class="card">
      <div class="dex-head">
        <div class="dex-title">도감</div>
        <div class="dex-count">포획 <b id="caughtCount">0</b> / 1025</div>
      </div>
      <input id="dexSearch" type="text" placeholder="이름 · 번호 검색" oninput="renderDex()">
      <div class="dex-tabs" id="dexTabs">
        <button class="dex-tab on" data-f="all" onclick="setDexFilter('all')">전체 <span class="cnt" id="cntAll">0</span></button>
        <button class="dex-tab" data-f="caught" onclick="setDexFilter('caught')">포획 <span class="cnt" id="cntCaught">0</span></button>
        <button class="dex-tab" data-f="uncaught" onclick="setDexFilter('uncaught')">미포획 <span class="cnt" id="cntUncaught">0</span></button>
        <button class="dex-tab" data-f="battle" onclick="setDexFilter('battle')">배틀 <span class="cnt" id="cntBattle">0</span></button>
      </div>
      <div class="dex-grid" id="dexGrid"></div>
    </div>
  </section>

  <!-- ===================== BATTLE ===================== -->
  <section id="battle" class="screen">
    <div class="topbar">
      <button class="iconbtn" onclick="quitBattle()">‹</button>
      <div class="brand"><b>LOCAL BATTLE</b><span class="dot-sep"></span>3 vs 3</div>
      <div style="width:42px"></div>
    </div>
    <div class="card"><div id="battleView"></div></div>
  </section>

</div>

let records=[];
let tickets={n:3,claimed:0};
let scoutSel=null;
const SCOUT_TYPES=["노말","불꽃","물","풀","전기","얼음","격투","독","땅","비행","에스퍼","벌레","바위","고스트","드래곤","악","강철","페어리"];
async function loadTickets(){
  try{ const v=localStorage.getItem("pkmn_tickets_v1"); if(v) tickets=JSON.parse(v); }catch(e){}
  try{ if((!tickets||tickets.n==null)&&window.storage&&window.storage.get){ const r=await window.storage.get("pkmn_tickets_v1"); if(r&&r.value) tickets=JSON.parse(r.value); } }catch(e){}
  if(!tickets||tickets.n==null) tickets={n:3,claimed:0};
  if(!tickets.bonus1){ tickets.n=(tickets.n||0)+3; tickets.bonus1=1; saveTickets(); }
  if(!tickets.bonus9){ tickets.n=(tickets.n||0)+9; tickets.bonus9=1; saveTickets(); if(typeof toast==="function")toast("🎟️ 배틀스카우트 티켓 9장이 지급됐어요!"); }
}
function saveTickets(){ const p=JSON.stringify(tickets); try{ localStorage.setItem("pkmn_tickets_v1",p); }catch(e){} try{ if(window.storage&&window.storage.set) window.storage.set("pkmn_tickets_v1",p); }catch(e){} updateTicketBtn(); }
function checkTicketRewards(){ const m=Math.floor((caught?caught.size:0)/100); if(m>(tickets.claimed||0)){ tickets.n=(tickets.n||0)+2*(m-(tickets.claimed||0)); tickets.claimed=m; saveTickets(); } }
function updateTicketBtn(){ const b=document.getElementById("ticketBtn"); if(b) b.innerHTML=`🎟️ ${tickets.n}`; }
function openTickets(){ showScreen("tickets"); renderTickets(); }
function scoutPick(t){ scoutSel=t; renderTickets(); }
function renderTickets(){
  const grid=SCOUT_TYPES.map(t=>`<button class="scout-type ${scoutSel===t?'sel':''}" style="--tc:${TYPE_COLOR[t]}" onclick="scoutPick('${t}')">${t}</button>`).join("");
  const canUse=tickets.n>0 && scoutSel;
  document.getElementById("tkview").innerHTML=`
    <div class="topbar"><button class="bt-act" onclick="goHome()">← 홈</button>
      <div class="scr-title">🎟️ 배틀스카우트</div><span style="width:56px"></span></div>
    <div class="tk-count">보유 티켓 <b>${tickets.n}</b>장</div>
    <div class="bt-sub" style="text-align:center;margin-bottom:12px">타입을 하나 골라 사용하면, 그 타입의 <b>배틀용 최종진화형</b>(1~9세대·보유 무관) 퀴즈가 1마리 나와요.</div>
    <div class="scout-grid">${grid}</div>
    <button class="btn primary" style="max-width:300px;margin:18px auto 0;display:block" ${canUse?"":"disabled"} onclick="useScout()">${tickets.n>0?(scoutSel?scoutSel+" 타입 스카우트 (티켓 1장)":"타입을 선택하세요"):"티켓이 없어요"}</button>
    <div class="bt-sub" style="text-align:center;margin-top:12px;font-size:11.5px;color:var(--faint)">도감을 100마리 채울 때마다 티켓 2장을 받아요.</div>`;
}
function useScout(){ if(tickets.n<=0||!scoutSel) return; tickets.n--; saveTickets(); startScoutQuiz(scoutSel); }
function startScoutQuiz(type){
  const all=DEX.filter(o=>o.fin && !o.leg && o.types.includes(type));
  if(!all.length){ alert("해당 타입의 배틀용 최종진화형이 없어요."); openTickets(); return; }
  const uncaught=all.filter(o=>!caught.has(o.id));
  const pool = uncaught.length>0 ? uncaught : all;   // 미포획 우선, 다 잡았으면 중복 허용
  startQuiz(pool[Math.floor(Math.random()*pool.length)], true);
}
function genPlayerCode(){ const s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<6;i++)c+=s[Math.floor(Math.random()*s.length)]; return c; }
function escapeHtml(x){ return (x||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function loadProfile(){
  try{ const v=localStorage.getItem("pkmn_profile_v1"); if(v) profile=JSON.parse(v); }catch(e){}
  try{ if((!profile||!profile.code)&&window.storage&&window.storage.get){ const r=await window.storage.get("pkmn_profile_v1"); if(r&&r.value) profile=JSON.parse(r.value); } }catch(e){}
  if(!profile) profile={code:"",nick:""};
  if(!profile.code) profile.code=genPlayerCode();
  if(!profile.nick) profile.nick="트레이너"+profile.code.slice(0,3);
  saveProfile();
  try{ const v=localStorage.getItem("pkmn_records_v1"); if(v) records=JSON.parse(v); }catch(e){}
  try{ if((!records||!records.length)&&window.storage&&window.storage.get){ const r=await window.storage.get("pkmn_records_v1"); if(r&&r.value) records=JSON.parse(r.value); } }catch(e){}
  if(!Array.isArray(records)) records=[];
}
function saveProfile(){ const p=JSON.stringify(profile); try{ localStorage.setItem("pkmn_profile_v1",p); }catch(e){} try{ if(window.storage&&window.storage.set) window.storage.set("pkmn_profile_v1",p); }catch(e){} }
function saveRecords(){ const p=JSON.stringify(records.slice(-200)); try{ localStorage.setItem("pkmn_records_v1",p); }catch(e){} try{ if(window.storage&&window.storage.set) window.storage.set("pkmn_records_v1",p); }catch(e){} }
function addRecord(r){ records.push(r); saveRecords(); }
function openRecords(){ showScreen("records"); renderRecords(); }
function renderRecords(){
  const on=records.filter(r=>r.mode==="online");
  const w=on.filter(r=>r.result==="win").length, l=on.filter(r=>r.result==="loss").length, tot=w+l, rate=tot?Math.round(w/tot*100):0;
  const byOpp={};
  for(const r of on){ const key=r.oppCode||r.opp||"상대"; if(!byOpp[key]) byOpp[key]={name:r.opp||"상대",code:r.oppCode||"",w:0,l:0}; if(r.result==="win")byOpp[key].w++; else byOpp[key].l++; if(r.opp) byOpp[key].name=r.opp; }
  const oppList=Object.values(byOpp).sort((a,b)=>(b.w+b.l)-(a.w+a.l));
  const oppRows=oppList.map(x=>`<div class="rec-row">
     <span class="rec-res ${x.w>=x.l?'win':'loss'}">${x.w}-${x.l}</span>
     <span class="rec-opp">${escapeHtml(x.name)}${x.code?` <span class="rec-sr">${x.code}</span>`:""}</span>
     <span class="rec-date">${Math.round(x.w/(x.w+x.l)*100)}%</span></div>`).join("") || `<div class="bt-sub" style="padding:10px 0">아직 상대별 기록이 없어요.</div>`;
  const rows=records.slice().reverse().slice(0,40).map(r=>`<div class="rec-row">
     <span class="rec-res ${r.result}">${r.result==="win"?"승":"패"}</span>
     <span class="rec-opp">vs ${escapeHtml(r.opp||"상대")}${r.bySurrender?" <span class=\"rec-sr\">(항복)</span>":""}</span>
     <span class="rec-date">${r.date||""}</span></div>`).join("") || `<div class="bt-sub" style="padding:14px 0">아직 대전 기록이 없어요. 온라인 대전을 해보세요!</div>`;
  document.getElementById("recview").innerHTML=`
    <div class="topbar"><button class="bt-act" onclick="goHome()">← 홈</button>
      <div class="scr-title">🏅 기록저장실</div><span style="width:56px"></span></div>
    <div class="prof-card">
      <div class="prof-row"><span class="prof-lbl">내 고유 코드</span><span class="prof-code">${profile.code}</span></div>
      <div class="prof-row"><span class="prof-lbl">닉네임</span>
        <span class="nick-wrap"><input id="nickIn" class="nick-in" maxlength="12" value="${escapeHtml(profile.nick)}">
        <button class="bt-act" onclick="saveNick()">저장</button></span></div>
    </div>
    <div class="stat-card"><div class="stat-big"><b>${w}</b>승 <b>${l}</b>패</div>
      <div class="stat-sub">온라인 승률 ${rate}% · 총 ${tot}전</div></div>
    <div class="bt-label">상대별 전적</div>
    <div class="rec-list">${oppRows}</div>
    <div class="bt-label" style="margin-top:16px">최근 대전 (온라인)</div>
    <div class="rec-list">${rows}</div>`;
}
function saveNick(){ const el=document.getElementById("nickIn"); const v=(el&&el.value||"").trim(); if(v){ profile.nick=v; saveProfile(); } renderRecords(); }
function recordBattle(winner,bySurrender){
  if(!B||B.mode!=="online"||B._recorded) return; B._recorded=true;
  const res=(winner===B.me)?"win":"loss";
  addRecord({opp:B.oppNick||B.oppCode||"상대", oppCode:B.oppCode||"", result:res, bySurrender:!!bySurrender, mode:"online", date:new Date().toLocaleDateString()});
}
async function loadCaught(){
  const ids = new Set();
  // 1) browser localStorage (works when opened as a normal page)
  try{
    for(const k of STORE_KEYS){
      const v = localStorage.getItem(k);
      if(v) JSON.parse(v).forEach(x=>ids.add(x));
    }
  }catch(e){}
  // 2) artifact storage (works inside the Claude runtime)
  try{
    if(window.storage && window.storage.get){
      for(const k of STORE_KEYS){
        try{ const r = await window.storage.get(k); if(r && r.value) JSON.parse(r.value).forEach(x=>ids.add(x)); }catch(e){}
      }
    }
  }catch(e){}
  caught = ids;
  updateHomeFoot();
  try{ checkTicketRewards(); }catch(e){}
  updateTicketBtn();
  if(ids.size) saveCaught();   // re-persist unified set to every available backend
}

async function saveCaught(){
  const payload = JSON.stringify([...caught]);
  let ok = false;
  try{ localStorage.setItem("pkmn_caught_v1", payload); ok = true; }catch(e){}
  try{ if(window.storage && window.storage.set){ await window.storage.set("pkmn_caught_v1", payload); ok = true; } }catch(e){}
  return ok;
}
function updateHomeFoot(){
  document.getElementById("homeFoot").textContent = `전국도감 · 1–9세대 1025마리 · 포획 ${caught.size}`;
  const n = DEX.reduce((a,m)=> a + ((m.fin && caught.has(m.id))?1:0), 0);
  const btn = document.getElementById("battleBtn");
  if(btn){
    if(n>=9){ btn.classList.remove("locked"); btn.innerHTML = `로컬 배틀 <span class="prog">최종진화형 ${n}마리 보유</span>`; }
    else{ btn.classList.add("locked"); btn.innerHTML = `로컬 배틀 🔒<span class="prog">최종진화형 ${n} / 9 필요</span>`; }
  }
}

/* ==== screen switching ==== */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  window.scrollTo(0,0);
}
function goHome(){
  const ap=document.getElementById("app"); if(ap) ap.classList.remove("wide-battle"); updateHomeFoot(); showScreen("home"); }

/* ==== quiz state ==== */
let R = null; // round

function startQuiz(mon, scout){
  mon = mon || DEX[Math.floor(Math.random()*DEX.length)];
  const revealIndex = mon.types.length>1 ? Math.floor(Math.random()*2) : 0;
  R = { mon, attempt:1, over:false, revealIndex, guessed:new Set(), scout:!!scout };
  // reset UI
  document.getElementById("resultActions").classList.remove("on");
  document.getElementById("suggest").classList.remove("on");
  document.getElementById("ribbon").classList.toggle("on", caught.has(mon.id));
  const g=document.getElementById("guess"); g.value=""; g.disabled=false;
  document.getElementById("goBtn").disabled=false;
  // orb
  const orb=document.getElementById("miniOrb"), img=document.getElementById("revealImg"), qm=orb.querySelector(".qm");
  img.style.display="none"; img.src=""; qm.style.display="";
  const hn=document.getElementById("headName"); hn.textContent="정체불명"; hn.classList.remove("revealed");
  // stats
  const total = mon.stats.reduce((a,b)=>a+b,0);
  document.getElementById("totalVal").textContent = total;
  const box=document.getElementById("stats"); box.innerHTML="";
  mon.stats.forEach((v,i)=>{
    const row=document.createElement("div"); row.className="stat";
    row.innerHTML=`<span class="lbl">${STAT_LABELS[i]}</span>
      <span class="track"><span class="fill"></span></span>
      <span class="num">${v}</span>`;
    box.appendChild(row);
    requestAnimationFrame(()=>{ row.querySelector(".fill").style.width = Math.min(100, v/200*100)+"%"; });
  });
  // reset hints
  resetHint("hintType","타입","1번 틀리면 공개");
  resetHint("hintGen","세대","2번 틀리면 공개");
  resetHint("hintEvo","진화","3번 틀리면 공개");
  // feedback + lives
  setFeedback("종족값을 보고 추리해 보세요.","neutral");
  renderLives(); renderAttemptTag();
  updateStreakLabel();
  showScreen("quiz");
  setTimeout(()=>g.focus(),150);
}

function resetHint(id,key,msg){
  const el=document.getElementById(id);
  el.className="hint-row locked";
  el.innerHTML=`<span class="hint-key">${key}</span><span class="hint-val"><span class="lockmsg">${msg}</span></span>`;
}
function renderAttemptTag(){ document.getElementById("attemptTag").textContent = `시도 ${R.attempt} / 4`; }
function renderLives(){
  const box=document.getElementById("lives"); box.innerHTML="";
  const left = 5 - R.attempt; // attempt1 -> 4 lives lit
  for(let i=0;i<4;i++){
    const d=document.createElement("span");
    d.className="life"+(i<left?" on":"");
    box.appendChild(d);
  }
}
function updateStreakLabel(){ document.getElementById("streak").innerHTML = `연속 <b>${streak}</b>`; }
let streak = 0;

/* ==== hint reveals ==== */
function revealType(){
  const el=document.getElementById("hintType");
  el.className="hint-row unlocked";
  const t=R.mon.types;
  let chips="";
  if(t.length===1){
    chips=`<span class="type-chip" style="background:${TYPE_COLOR[t[0]]}">${t[0]}</span>
           <span style="color:var(--faint);font-size:12px">단일 타입</span>`;
  }else{
    chips = t.map((tp,i)=> i===R.revealIndex
      ? `<span class="type-chip" style="background:${TYPE_COLOR[tp]}">${tp}</span>`
      : `<span class="type-chip hidden">?</span>`).join("");
  }
  el.innerHTML=`<span class="hint-key">타입</span><span class="hint-val">${chips}</span>`;
}
function revealGen(){
  const el=document.getElementById("hintGen");
  el.className="hint-row unlocked";
  el.innerHTML=`<span class="hint-key">세대</span><span class="hint-val"><span class="gen-badge">${R.mon.gen}세대</span></span>`;
}
function revealEvo(){
  const el=document.getElementById("hintEvo");
  el.className="hint-row unlocked";
  el.innerHTML=`<span class="hint-key">진화</span><span class="hint-val"><span class="evo-badge">${R.mon.evo}</span></span>`;
}

/* ==== guessing ==== */
function setFeedback(msg,cls){ const f=document.getElementById("feedback"); f.textContent=msg; f.className="feedback "+cls; }

function submitGuess(name){
  if(R.over) return;
  const match = DEX.find(m=>norm(m.name)===norm(name));
  if(!match){ setFeedback("그런 포켓몬은 목록에 없어요. 다시 확인!","neutral"); return; }
  document.getElementById("guess").value="";
  document.getElementById("suggest").classList.remove("on");

  if(match.id===R.mon.id){ endRound(true); return; }

  // wrong
  if(R.guessed.has(match.id)){ setFeedback(`${match.name}(은)는 이미 시도했어요.`,"neutral"); return; }
  R.guessed.add(match.id);
  R.attempt++;
  renderLives(); renderAttemptTag();

  if(R.attempt===2){ revealType(); setFeedback(`${match.name}! 아니에요. 타입 힌트가 열렸어요.`,"bad"); }
  else if(R.attempt===3){ revealGen(); setFeedback(`${match.name}… 아니에요. 세대 힌트 공개!`,"bad"); }
  else if(R.attempt===4){ revealEvo(); setFeedback(`${match.name}… 땡! 마지막 힌트, 진화 정보입니다.`,"bad"); }
  else { endRound(false); } // attempt would be 5 -> out of tries
}

function endRound(win){
  R.over=true;
  document.getElementById("guess").disabled=true;
  document.getElementById("goBtn").disabled=true;
  document.getElementById("suggest").classList.remove("on");
  // reveal all remaining hints for learning
  if(document.getElementById("hintType").classList.contains("locked")) revealTypeFull();
  else if(R.mon.types.length>1){ revealTypeFull(); } // show hidden second type too
  if(document.getElementById("hintGen").classList.contains("locked")) revealGen();
  if(document.getElementById("hintEvo").classList.contains("locked")) revealEvo();
  // reveal sprite + name
  const orb=document.getElementById("miniOrb"), img=document.getElementById("revealImg"), qm=orb.querySelector(".qm");
  img.onload=()=>{ qm.style.display="none"; img.style.display="block"; };
  img.onerror=()=>{ qm.textContent="✓"; };
  img.src=SPRITE(R.mon.id);
  const hn=document.getElementById("headName"); hn.textContent=R.mon.name; hn.classList.add("revealed");

  if(win){
    streak++; updateStreakLabel();
    if(!caught.has(R.mon.id)){ caught.add(R.mon.id); saveCaught(); checkTicketRewards(); }
    const tries = R.attempt;
    setFeedback(`정답! ${tries}번 만에 맞혔어요 🎉`,"ok");
  }else{
    streak=0; updateStreakLabel();
    setFeedback(`아쉬워요! 정답은 ${R.mon.name}`,"bad");
  }
  const ra=document.getElementById("resultActions");
  if(R.scout){ ra.innerHTML=`<button class="btn primary" onclick="goHome()">메인화면으로</button>`; }
  else{ ra.innerHTML=`<button class="btn primary" onclick="startQuiz()">다음 포켓몬</button><button class="btn ghost" onclick="goHome()">홈으로</button>`; }
  ra.classList.add("on");
  ra.scrollIntoView({behavior:"smooth",block:"nearest"});
}
// reveal both types fully (used at round end)
function revealTypeFull(){
  const el=document.getElementById("hintType");
  el.className="hint-row unlocked";
  const chips=R.mon.types.map(tp=>`<span class="type-chip" style="background:${TYPE_COLOR[tp]}">${tp}</span>`).join("");
  el.innerHTML=`<span class="hint-key">타입</span><span class="hint-val">${chips}</span>`;
}

/* ==== autocomplete ==== */
let sugList=[], sugActive=-1;
function onType(){
  const q=norm(document.getElementById("guess").value);
  const box=document.getElementById("suggest");
  if(!q){ box.classList.remove("on"); sugList=[]; sugActive=-1; return; }
  sugList = DEX.filter(m=>norm(m.name).includes(q)).slice(0,7);
  if(!sugList.length){ box.classList.remove("on"); return; }
  sugActive=-1;
  box.innerHTML = sugList.map((m,i)=>
    `<div class="sug" data-i="${i}" onmousedown="pick(${i})">
       <span>${dn(m)}</span><span class="id">No.${String(m.id).padStart(3,"0")}</span></div>`).join("");
  box.classList.add("on");
}
function pick(i){ const m=sugList[i]; if(m) submitGuess(m.name); }
function submitTop(){
  const v=document.getElementById("guess").value.trim();
  if(!v) return;
  if(sugActive>=0 && sugList[sugActive]){ submitGuess(sugList[sugActive].name); return; }
  if(sugList.length){ submitGuess(sugList[0].name); return; }
  submitGuess(v);
}
function onKey(e){
  const box=document.getElementById("suggest");
  if(box.classList.contains("on") && sugList.length){
    if(e.key==="ArrowDown"){ e.preventDefault(); sugActive=(sugActive+1)%sugList.length; paintActive(); return; }
    if(e.key==="ArrowUp"){ e.preventDefault(); sugActive=(sugActive-1+sugList.length)%sugList.length; paintActive(); return; }
  }
  if(e.key==="Enter"){ e.preventDefault(); submitTop(); }
}
function paintActive(){
  document.querySelectorAll(".sug").forEach((el,i)=>el.classList.toggle("active",i===sugActive));
}

/* ==== DEX ==== */
let dexFilter = "all";
function setDexFilter(f){
  dexFilter = f;
  document.querySelectorAll(".dex-tab").forEach(b=>b.classList.toggle("on", b.dataset.f===f));
  renderDex();
}
function showMoveset(id){
  const m=DEX.find(x=>x.id===id); if(!m||!m.mv||!m.mv.length)return;
  let el=document.getElementById("msModal");
  if(!el){ el=document.createElement("div"); el.id="msModal"; el.className="ms-modal"; el.addEventListener("click",e=>{ if(e.target===el) closeMoveset(); }); document.body.appendChild(el); }
  const abTxt = m.ab?`<div class="ms-ab">특성: <b>${m.ab}</b></div>`:"";
  const rows=m.mv.map(mv=>{
    const cat=(mv.c==='x'||!mv.p)?'변화':(mv.c==='p'?'물리':'특수');
    const pw=(mv.p>0)?('위력 '+mv.p):'—';
    const acc=(mv.a>0)?(' · 명중 '+mv.a):'';
    return `<div class="ms-row"><span class="tt" style="background:${TYPE_COLOR[mv.t]}">${mv.t}</span>
      <span class="ms-n">${mv.n}</span><span class="ms-meta">${cat} · ${pw}${acc} · PP ${mv.pp!=null?mv.pp:'-'}</span></div>`;
  }).join("");
  el.innerHTML=`<div class="ms-box"><div class="ms-head"><span>${dn(m)} <span class="ms-no">No.${String(m.id).padStart(3,"0")}</span></span><button onclick="closeMoveset()">✕</button></div>${abTxt}<div class="ms-list">${rows}</div></div>`;
  el.classList.add("on");
}
function closeMoveset(){ const el=document.getElementById("msModal"); if(el)el.classList.remove("on"); }
function openDex(){ renderDex(); showScreen("dex"); }
function renderDex(){
  document.getElementById("caughtCount").textContent = caught.size;
  document.getElementById("cntAll").textContent = DEX.length;
  document.getElementById("cntCaught").textContent = caught.size;
  document.getElementById("cntUncaught").textContent = DEX.length - caught.size;
  document.getElementById("cntBattle").textContent = DEX.reduce((a,m)=>a+((m.fin&&!m.leg&&m.gen<=9&&m.mv&&m.mv.length>0&&caught.has(m.id))?1:0),0);

  for(let p=0;p<2;p++){ const m=B.teams[p][B.active[p]]; if(m&&!m.fainted&&m.vol.yawnN>0){ if(--m.vol.yawnN===0){ if(!m.status) trySetStatus(m,"slp",log); } else log.push({t:`${dn(m)}는 꾸벅꾸벅 졸고 있다…`,c:""}); } }
  for(let side=0;side<2;side++){ if(B.tailwind[side]>0){ if(--B.tailwind[side]===0) log.push({t:`${pName(side)}쪽의 순풍이 그쳤다.`,c:""}); } }
  for(let p2=0;p2<2;p2++){ const m=B.teams[p2][B.active[p2]]; if(m&&!m.fainted&&m.vol.aquaring&&m.hp<m.maxHP&&!abIndirect(m)){ const h=Math.max(1,Math.floor(m.maxHP/16)); m.hp=Math.min(m.maxHP,m.hp+h); log.push({t:`${dn(m)}는 아쿠아링으로 회복했다! (+${h})`,c:""}); } }
  for(let side=0;side<2;side++){ if(B.wish[side]){ if(B.wish[side].turns<=0){ const am=B.teams[side][B.active[side]]; if(am&&!am.fainted&&am.hp<am.maxHP){ const h=Math.min(B.wish[side].amt, am.maxHP-am.hp); am.hp+=h; log.push({t:`${am.name}의 소원이 이루어졌다! (+${h})`,c:""}); } B.wish[side]=null; } else { B.wish[side].turns--; } } }
  for(const pp of order){ const m=B.teams[pp][B.active[pp]]; if(m&&!m.fainted&&m.vol.perishN>0){ m.vol.perishN--; if(m.vol.perishN<=0){ log.push({t:`${dn(m)}는 멸망의 노래로 쓰러졌다!`,c:"faint-l"}); faint(m,log); } else { log.push({t:`${dn(m)}의 멸망 카운트 ${m.vol.perishN}`,c:"eff-weak"}); } } }
  for(let p=0;p<2;p++){ const m=B.teams[p][B.active[p]]; if(m){ m.vol.flinch=false; m.vol.protect=false; m.vol.endure=false; m.vol._proK=""; m.vol.turnsOut=(m.vol.turnsOut||0)+1; m.vol.tookPhys=0; m.vol.tookSpec=0; m.vol._movedThisTurn=false; m.vol._beakCharge=false; m.vol._justSwitched=false; if(m.ab==="schooling")applySchooling(m,log); if(m.ab==="shields-down")applyShieldsDown(m,log); if(m.ab==="berserk"&&m.hp>=m.maxHP/2)m._berserkDone=false; if(m.ab==="anger-shell"&&m.hp>=m.maxHP/2)m._angerDone=false; if(m.ab==="hunger-switch"&&!m.fainted){ m._hangry=!m._hangry; } if(m.vol._throatN>0)m.vol._throatN--; if(m.vol._healBlockN>0)m.vol._healBlockN--; if(m.vol.disabled&&m.vol.disabled.turns>0){ m.vol.disabled.turns--; if(m.vol.disabled.turns<=0){ log.push({t:`${dn(m)}의 ${m.vol.disabled.n} 봉인이 풀렸다!`,c:""}); m.vol.disabled=null; } } if(m.vol.roost){ if(m.vol._roostTypes)m.types=m.vol._roostTypes; m.vol.roost=false; m.vol._roostTypes=null; } } }

/* ---------- draft ---------- */
function draftGridHTML(){
  const _q=(B._draftQuery||"").trim();
  let _items=B.draw.map((m,i)=>({m,i})).sort((a,b)=>(a.m.id||0)-(b.m.id||0));
  if(_q) _items=_items.filter(x=>x.m.name.includes(_q)||String(x.m.id).includes(_q));
  if(_items.length===0) return `<div class="draft-empty">검색 결과가 없어요</div>`;
  return _items.map(({m,i})=>{
    const on=B.sel.includes(i), order=on?(B.sel.indexOf(i)+1):"";
    const types=m.types.map(t=>`<span class="tt" style="background:${TYPE_COLOR[t]}">${t}</span>`).join("");
    const bst=m.stats.reduce((a,b)=>a+b,0);
    return `<div class="draft-mon ${on?'sel':''}" onclick="toggleDraft(${i})"><div class="pick-no">${order}</div>
      <div class="dm-name">${dn(m)}</div><div class="dm-types">${types}</div><div class="dm-bst">BST ${bst}</div></div>`;
  }).join("");
}
function updateDraftGo(){
  const go=document.getElementById("draftGo");
  if(!go) return;
  go.disabled = B.sel.length!==3;
  go.textContent = B.sel.length===3 ? '이 팀으로 확정' : '3마리 선택 ('+B.sel.length+'/3)';
  go.style.opacity = B.sel.length===3?1:.5;

}
function refreshDraftGrid(){ const g=document.getElementById("draftGrid"); if(g) g.innerHTML=draftGridHTML(); updateDraftGo(); }
function renderDraft(){
  const p=B.dp;
  const _q=(B._draftQuery||"");
  const _searchBar=`<input id="draftSearch" class="draft-search" placeholder="🔍 이름·도감번호 검색" value="${_q.replace(/"/g,"&quot;")}" oninput="onDraftSearch(this.value)">`;
  const label = (B.mode==="online") ? `${whoTag(B.me)} (나)` : whoTag(p);
  bview().innerHTML=
    `<div class="bt-head"><div class="bt-title">팀 선택</div>
       <div class="bt-sub">${label} · 잡은 포켓몬 중 <b>3마리</b>를 고르세요 (전설·환상 제외)</div></div>
     ${_searchBar}
     <div class="draft-grid" id="draftGrid">${draftGridHTML()}</div>
     <button class="btn primary" id="draftGo" ${B.sel.length===3?'':'disabled'} onclick="confirmDraft()">
       ${B.sel.length===3?'이 팀으로 확정':'3마리 선택 ('+B.sel.length+'/3)'}</button>`;
  updateDraftGo();
  window.scrollTo(0,0);
}
function onDraftSearch(v){ B._draftQuery=v; refreshDraftGrid(); }
function toggleDraft(i){ const k=B.sel.indexOf(i); if(k>=0)B.sel.splice(k,1); else{ if(B.sel.length>=3)return; B.sel.push(i);} refreshDraftGrid(); }
function confirmDraft(){
  if(B.sel.length!==3) return;
  const picks=B.sel.map(i=>B.draw[i]);
  if(B.mode==="hotseat"){
    B.teams[B.dp]=picks.map(makeMon);
    if(B.dp===0) handoff("🔄","다음 플레이어","기기를 "+pName(1)+"에게 넘기세요.<br>"+pName(1)+"의 팀을 뽑습니다.",()=>startDraft(1));
    else handoff("⚔️","배틀 시작","기기를 "+pName(0)+"에게 넘기세요.<br>"+pName(0)+"부터 행동을 선택합니다.",()=>{ initField(); B.teams[0][0].seen=true; B.teams[1][0].seen=true; abLeadEntry(); startTurnHotseat(); });
  }else{ // online
    const teamData=picks.map(m=>({id:m.id,name:m.name,types:m.types,stats:m.stats,mv:m.mv,abk:m.abk,ab:m.ab}));
    if(B.role==="host"){ B.teams[0]=picks.map(makeMon); B.hostReady=true; tryStartOnline(); renderWait("상대의 팀 선택을 기다리는 중…"); }
    else{ pendingSend({t:"team",team:teamData}); renderWait("상대의 준비를 기다리는 중…"); }
  }
}

/* ---------- hotseat flow ---------- */
function startHotseat(){
  B={ mode:"hotseat", pool:myPool(), teams:[[],[]], active:[0,0], actions:[null,null], names:["플레이어 1","플레이어 2"] };
  handoff("🎮","로컬 배틀","같은 기기로 번갈아 플레이해요.<br>먼저 "+pName(0)+"의 팀부터 뽑습니다.",()=>startDraft(0));
}
function startDraft(p){ B.phase="draft"; B.dp=p; B.draw=shuffle(B.pool); B.sel=[]; renderDraft(); }
function handoff(ico,msg,sub,fn){ clearTurnClock(); B.phase="handoff"; continueFn=fn;
  bview().innerHTML=`<div class="handoff"><div class="ho-ico">${ico}</div><div class="ho-msg">${msg}</div>
     <div class="ho-sub">${sub}</div><button class="btn primary" style="max-width:240px" onclick="runContinue()">준비 완료</button></div>`;
  window.scrollTo(0,0);
}
function forcedAction(p){ const m=B.teams[p][B.active[p]]; if(!m)return null;
  if(m.ab==="truant" && m.vol.truant) return {type:"move",mi:0};
  if(m.vol.recharge) return {type:"move",mi:0};
  if(m.vol.rampageN>0 && m.moves[m.vol.rampageMove]) return {type:"move",mi:m.vol.rampageMove};
  if(m.vol.charging) return {type:"move",mi:m.vol.charging.mi};
  if(m.pp && m.pp.length && m.pp.every(v=>v<=0)) return {type:"move",mi:0};
  if(m.vol.encoreN>0 && m.moves[m.vol.encoreMove]) return {type:"move",mi:m.vol.encoreMove};
  return null; }
var _clockIv=null;
const TURN_SECS=45;
function startTurnClock(){ B._turnDeadline=Date.now()+TURN_SECS*1000; }
function clearTurnClock(){ B._turnDeadline=null; if(_clockIv){clearInterval(_clockIv);_clockIv=null;} }
function mountClock(){
  if(_clockIv){clearInterval(_clockIv);_clockIv=null;}
  if(!B._turnDeadline) return;
  const upd=()=>{
    const rem=Math.max(0,B._turnDeadline-Date.now());
    const fill=document.getElementById("ttFill"), sec=document.getElementById("ttSec");
    if(!fill||!sec){ if(_clockIv){clearInterval(_clockIv);_clockIv=null;} return; }
    fill.style.width=(rem/(TURN_SECS*1000)*100)+"%";
    const ss=Math.ceil(rem/1000); sec.textContent=ss+"초";
    fill.style.background = ss<=10 ? "var(--bad,#e05a3a)" : "var(--gold,#ffce5c)";
    if(rem<=0){ clearInterval(_clockIv); _clockIv=null; onTimeout(); }
  };
  upd(); _clockIv=setInterval(upd,250);
}
function onTimeout(){
  if(B.phase!=="choose") return;
  const me=B.chooseMe, mon=B.teams[me][B.active[me]];
  clearTurnClock();
  submitAction({type:"move",mi:Math.floor(Math.random()*mon.moves.length)});
}
function startTurnHotseat(){ B.actions=[null,null]; chooseHotseat(0); }
function chooseHotseat(p){ B.phase="choose"; B.dp=p; B.chooseMode="main"; B.infoOpen=null; const fa=forcedAction(p); if(fa){ submitAction(fa); return; } startTurnClock(); renderChoose(p); }

function renderChoose(me){
  B.chooseMe=me;
  const meMon=B.teams[me][B.active[me]];
  let panel;
  if(B.chooseMode==="pivot"){
    const bench=B.teams[me].map((m,i)=>({m,i})).filter(x=>!x.m.fainted && x.i!==B.active[me]);
    const list=bench.map(x=>{
      const types=x.m.types.map(t=>`<span class="mv-t" style="background:${TYPE_COLOR[t]}">${t}</span>`).join("");
      return `<button class="move-btn" onclick="pickPivot(${x.i})"><span class="mv-n">${x.m.name}</span>
        <span class="mv-meta">${types}<span class="mv-cat">HP ${Math.ceil(x.m.hp)}/${x.m.maxHP}</span></span></button>`;
    }).join("");
    panel=`<div class="bt-label">${meMon.moves[B._pivotMi].n} — 교대할 포켓몬 선택</div><div class="move-grid">${list}</div>
      <div class="bt-actions"><button class="bt-act" onclick="B.chooseMode='main';renderChoose(${me})">뒤로</button></div>`;
  }else if(B.chooseMode==="switch"){
    const bench=B.teams[me].map((m,i)=>({m,i})).filter(x=>!x.m.fainted && x.i!==B.active[me]);
    const list = bench.length? bench.map(x=>{
      const types=x.m.types.map(t=>`<span class="mv-t" style="background:${TYPE_COLOR[t]}">${t}</span>`).join("");
      return `<button class="move-btn" onclick="pickSwitch(${x.i})"><span class="mv-n">${x.m.name}</span>
        <span class="mv-meta">${types}<span class="mv-cat">HP ${Math.ceil(x.m.hp)}/${x.m.maxHP}</span></span></button>`;
    }).join("") : `<div class="bt-sub" style="grid-column:1/-1">교체할 수 있는 포켓몬이 없어요.</div>`;
    panel=`<div class="bt-label">교체할 포켓몬</div><div class="move-grid">${list}</div>
      <div class="bt-actions"><button class="bt-act" onclick="B.chooseMode='main';renderChoose(${me})">뒤로</button></div>`;
  }else{
    const _enc=(meMon.vol&&meMon.vol.encoreN>0&&meMon.moves[meMon.vol.encoreMove])?meMon.vol.encoreMove:-1;
    const moves=meMon.moves.map((mv,i)=>{

    }).join("");

    const bound=(meMon.vol&&meMon.vol.bindN>0);

    panel=`<div class="bt-label">기술 선택 <span style="text-transform:none;letter-spacing:0;color:var(--faint)">· ⓘ를 눌러 효과 확인</span></div>
      <div class="move-grid">${moves}</div>${info}

  }

  const timer = B._turnDeadline ? `<div class="turn-timer"><div class="tt-track"><div id="ttFill" class="tt-fillbar"></div></div><span id="ttSec" class="tt-sec"></span></div>` : "";
  bview().innerHTML=`<div class="bt-head"><div class="bt-sub">${head}</div></div>`+timer+boardHTML(me)+panel;
  mountClock();

}

/* action inputs (route by mode) */
function actorNow(){ return (B.mode==="online") ? B.me : B.dp; }
function pickMove(mi){
  const me=B.chooseMe, mon=B.teams[me][B.active[me]], mv=mon.moves[mi];
  if(mon.vol&&mon.vol.encoreN>0&&mon.moves[mon.vol.encoreMove]&&mi!==mon.vol.encoreMove) return; // 앙코르: 지정 기술만
  const bench=B.teams[me].map((m,i)=>i).filter(i=>i!==B.active[me] && !B.teams[me][i].fainted);
  if(mv && (mv.sw||mv.baton) && bench.length>0){ B.chooseMode="pivot"; B._pivotMi=mi; renderChoose(me); return; }
  submitAction({type:"move",mi});
}
function pickPivot(i){ const mi=B._pivotMi; submitAction({type:"move",mi,pivotTo:i}); }
function pickSwitch(to){ submitAction({type:"switch",to}); }
function submitAction(action){
  clearTurnClock();
  const p=actorNow();
  if(B.mode==="hotseat"){
    B.actions[p]=action;
    if(p===0) handoff("🔄","상대 차례","기기를 "+pName(1)+"에게 넘기세요.",()=>chooseHotseat(1));
    else resolveHotseat();
  }else{
    if(B.role==="host"){ B.actions[0]=action; renderWait("상대의 선택을 기다리는 중…"); tryResolveOnline(); }
    else{ pendingSend({t:"act",action,turn:B.turnNo}); renderWait("상대의 선택을 기다리는 중…"); }
  }
}
function pickSurrender(){
  const p=actorNow();
  if(!confirm(pName(p)+" 항복할까요?")) return;
  if(B.mode==="hotseat"){ endBattle(1-p,true); }
  else{ if(B.role==="host") onlineEnd(1,true); else { netSend({t:"surrender"}); renderWait("항복 처리 중…"); } }
}

/* ---------- resolve (shared compute) ---------- */
function computeResolve(){
  const log = (B.carryLog&&B.carryLog.length)?B.carryLog.slice():[];
  B.carryLog=[];
  B._battleStarted=true;
  for(let p=0;p<2;p++){ const a=B.actions[p]; if(a&&a.type==="switch"){ doSwitchIn(p,a.to,log); } }
  const movers=[0,1].filter(p=>B.actions[p]&&B.actions[p].type==="move");
  for(const p of movers){ const mn=B.teams[p][B.active[p]]; const mvv=mn.moves[B.actions[p].mi]; if(mvv&&mvv.beakblast){ mn.vol._beakCharge=true; log.push({t:`${mn.name}는 부리를 뜨겁게 달구고 있다!`,c:""}); } }
  movers.sort((x,y)=>{
    const mx=B.teams[x][B.active[x]].moves[B.actions[x].mi], my=B.teams[y][B.active[y]].moves[B.actions[y].mi];
    const px=(mx.pr||0)+prankBonus(B.teams[x][B.active[x]],mx)+terrainPrio(mx)+galeBonus(B.teams[x][B.active[x]],mx)+triageBonus(B.teams[x][B.active[x]],mx), py=(my.pr||0)+prankBonus(B.teams[y][B.active[y]],my)+terrainPrio(my)+galeBonus(B.teams[y][B.active[y]],my)+triageBonus(B.teams[y][B.active[y]],my);
    if(px!==py) return py-px;
    const sx=effSpe(B.teams[x][B.active[x]]), sy=effSpe(B.teams[y][B.active[y]]);
    const spd = B.trickroom>0 ? (sx-sy) : (sy-sx);
    return spd || (Math.random()<.5?-1:1);
  });
  for(const p of movers){ if(B.teams[p][B.active[p]].fainted) continue; execMove(p,B.actions[p].mi,log); }
  endOfTurn(log);
  B.turnLog=log;
}
function resolvedHTML(me,showContinue){
  const lines=B.turnLog.map(l=>`<div class="logline ${l.c}">${l.t}</div>`).join("")||`<div class="logline">…</div>`;
  return boardHTML(me)+`<div class="turnlog">${lines}</div>`+
    (showContinue?`<button class="btn primary" onclick="afterResolved()">계속</button>`
                 :`<div class="conn-status"><span class="conn-dot"></span>상대를 기다리는 중…</div>`);
}
/* hotseat resolve */
function resolveHotseat(){ computeResolve(); B.phase="resolved"; bview().innerHTML=resolvedHTML(0,true); window.scrollTo(0,0); }
function nextReplaceHotseat(){
  if(B.repQueue.length===0){ startTurnHotseat(); return; }
  const p=B.repQueue.shift();
  if(B.teams[p].every(m=>m.fainted)){ endBattle(1-p,false); return; }
  handoff("🔄",pName(p)+" 교체","기기를 "+pName(p)+"에게 넘기세요.<br>쓰러진 포켓몬을 교체합니다.",()=>renderReplace(p,"hotseat"));
}
function renderReplace(p,ctx){
  B.phase="replace";
  const bench=B.teams[p].map((m,i)=>({m,i})).filter(x=>!x.m.fainted);
  const list=bench.map(x=>{
    const types=x.m.types.map(t=>`<span class="mv-t" style="background:${TYPE_COLOR[t]}">${t}</span>`).join("");
    return `<button class="move-btn" onclick="pickReplace(${p},${x.i},'${ctx}')"><span class="mv-n">${x.m.name}</span>
      <span class="mv-meta">${types}<span class="mv-cat">HP ${Math.ceil(x.m.hp)}/${x.m.maxHP}</span></span></button>`;
  }).join("");
  bview().innerHTML=`<div class="bt-head"><div class="bt-sub">${whoTag(p)} · 다음 포켓몬을 내보내세요</div></div><div class="move-grid">${list}</div>`;
  window.scrollTo(0,0);
}
function pickReplace(p,i,ctx){
  if(ctx==="guest"){ pendingSend({t:"replacePick",idx:i}); renderWait("진행 중…"); return; }
  if(!B.carryLog) B.carryLog=[];
  doSwitchIn(p,i,B.carryLog);
  const mon=B.teams[p][B.active[p]];
  const dead=mon.fainted, allDead=B.teams[p].every(m=>m.fainted);
  if(dead && !allDead){ if(B.repQueue) B.repQueue.unshift(p); }
  if(ctx==="hotseat"){ nextReplaceHotseat(); }
  else if(ctx==="hostself"){ callNextReplaceOnline(); }
}

function endBattle(winner,bySurrender){

/* ==================== NETWORK (WebRTC via PeerJS) ==================== */
function renderWait(msg){ clearTurnClock(); B.phase="wait"; bview().innerHTML=`<div class="handoff"><div class="ho-ico">⏳</div><div class="ho-sub">${msg}</div></div>`; window.scrollTo(0,0); armGuestSync(); }
function genCode(){ const s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<4;i++) c+=s[Math.floor(Math.random()*s.length)]; return c; }
function startHeartbeat(){
  try{ if(net&&net._hbIv){ clearInterval(net._hbIv); } }catch(e){}
  if(!net) return;
  net._lastRecv=Date.now();
  net._hbIv=setInterval(()=>{
    try{
      if(!net||!net.conn){ return; }
      // keep NAT binding alive + detect silent drops
      if(net.conn.open){ try{ net.conn.send({t:"ping"}); }catch(e){} }
      // try to recover a peer that got disconnected from the signaling server
      if(net.peer && net.peer.disconnected && !net.peer.destroyed){ try{ net.peer.reconnect(); }catch(e){} }
    }catch(e){}
  }, 5000);
}
function stopHeartbeat(){ try{ if(net&&net._hbIv){ clearInterval(net._hbIv); net._hbIv=null; } }catch(e){} }
function netClose(){ try{ if(_clockIv){clearInterval(_clockIv);_clockIv=null;} }catch(e){} stopHeartbeat(); try{ if(net&&net._waitIv){ clearInterval(net._waitIv); net._waitIv=null; } }catch(e){} try{ if(B){ if(B._pendTimer){clearTimeout(B._pendTimer);B._pendTimer=null;} if(B._syncIv){clearInterval(B._syncIv);B._syncIv=null;} B._pending=null; } }catch(e){} try{ if(net){ if(net.conn) net.conn.close(); if(net.peer) net.peer.destroy(); } }catch(e){} net=null; }
function netSend(o){ try{ if(net&&net.conn&&net.conn.open) net.conn.send(o); }catch(e){} }
function armResend(){ if(B._pendTimer)clearTimeout(B._pendTimer); B._pendTimer=setTimeout(()=>{ if(B&&B.phase==="wait"&&B._pending){ netSend(B._pending); armResend(); } },2500); }
function pendingSend(o){ B._pending=o; netSend(o); armResend(); }
function sendGuest(o){ if(B) B._lastToGuest=o; netSend(o); }
function resendGuest(){ if(B&&B._lastToGuest) netSend(B._lastToGuest); }
function clearPending(){ if(B){ B._pending=null; if(B._pendTimer){ clearTimeout(B._pendTimer); B._pendTimer=null; } } }
function armGuestSync(){ if(!B||B.mode!=="online"||B.role!=="guest") return; if(B._syncIv) clearInterval(B._syncIv); B._syncIv=setInterval(()=>{ if(B&&B.phase==="wait"){ netSend({t:"sync"}); } else { clearInterval(B._syncIv); B._syncIv=null; } },3000); }
function clearGuestSync(){ if(B&&B._syncIv){ clearInterval(B._syncIv); B._syncIv=null; } }

const ICE={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},

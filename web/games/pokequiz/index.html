  {urls:"stun:stun.cloudflare.com:3478"},
  {urls:"stun:global.stun.twilio.com:3478"},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:a.relay.metered.ca:80",username:"e8dd65b92c62d3924a14aa75",credential:"uWdWNmkhvyqTEswO"},
  {urls:"turn:a.relay.metered.ca:443",username:"e8dd65b92c62d3924a14aa75",credential:"uWdWNmkhvyqTEswO"},
  {urls:"turn:a.relay.metered.ca:443?transport=tcp",username:"e8dd65b92c62d3924a14aa75",credential:"uWdWNmkhvyqTEswO"}
]};
function netHost(){
  if(typeof Peer==="undefined"){ renderNetError("온라인 모듈을 불러오지 못했어요. 이 파일을 일반 브라우저(크롬/사파리)에서 열고 인터넷에 연결해 주세요."); return; }
  netClose();
  B={ mode:"online", role:"host", me:0, teams:[[],[]], active:[0,0], actions:[null,null], names:[profile.nick||"나","상대"], pool:myPool() };
  let tries=0;
  const create=()=>{
    const code=genCode();
    const peer=new Peer("PKMNB-"+code,{debug:0,config:ICE});
    net={peer,conn:null,role:"host",code};
    renderHostWait(code,"방을 여는 중…",false);
    peer.on("open",()=>{ renderHostWait(code,"상대의 접속을 기다리는 중…",false);
      try{ if(net) net._waitIv=setInterval(()=>{ try{ if(net&&net.peer&&net.peer.disconnected&&!net.peer.destroyed&&!net.conn) net.peer.reconnect(); }catch(e){} }, 4000); }catch(e){}
    });
    peer.on("connection",(c)=>{ try{ if(net&&net._waitIv){ clearInterval(net._waitIv); net._waitIv=null; } }catch(e){} net.conn=c; wireConn(c,()=>{ startHeartbeat(); onlineStartDraft(); }); });
    peer.on("disconnected",()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
    peer.on("error",(err)=>{
      if((err.type==="unavailable-id")&&tries<6){ tries++; try{peer.destroy();}catch(e){} create(); return; }
      if(err.type==="network"||err.type==="disconnected"||err.type==="server-error"){ try{ if(!peer.destroyed&&peer.disconnected) peer.reconnect(); }catch(e){} return; }
      renderNetError("연결 오류: "+(err.type||err.message||err));
    });
  };
  create();
}
function renderHostWait(code,status,err){
  bview().innerHTML=
   `<div class="bt-head"><div class="bt-title">방 코드</div><div class="bt-sub">이 코드를 친구에게 알려주세요</div></div>
    <div class="roomcode">${code}</div>
    <div class="conn-status"><span class="conn-dot ${err?'err':''}"></span>${status}</div>
    <div class="net-hint">친구가 <b>방 참가</b>에서 이 4자리 코드를 입력하면 시작돼요.<br>두 기기 모두 인터넷 연결이 필요하고, 이 파일을 일반 브라우저에서 열어야 해요.</div>
    <div class="home-btns" style="max-width:280px;margin:16px auto 0"><button class="btn ghost" onclick="quitBattle()">취소</button></div>`;
  window.scrollTo(0,0);
}
function renderJoin(){
  bview().innerHTML=
   `<div class="bt-head"><div class="bt-title">방 참가</div><div class="bt-sub">친구가 알려준 코드를 입력하세요</div></div>
    <input class="code-in" id="joinCode" maxlength="4" autocomplete="off" placeholder="ABCD" oninput="this.value=this.value.toUpperCase()">
    <button class="btn primary" onclick="netJoin()">접속</button>
    <div class="home-btns" style="max-width:280px;margin:12px auto 0"><button class="btn ghost" onclick="renderLobby()">뒤로</button></div>`;
  window.scrollTo(0,0);
}
function netJoin(){
  if(typeof Peer==="undefined"){ renderNetError("온라인 모듈을 불러오지 못했어요. 일반 브라우저에서 열어주세요."); return; }
  const code=(document.getElementById("joinCode").value||"").trim().toUpperCase();
  if(code.length!==4){ alert("4자리 코드를 입력해 주세요."); return; }
  if(myPool().length<3){ alert("전설·환상을 제외한 최종진화형이 3마리 이상이어야 참가할 수 있어요."); return; }
  netClose();
  B={ mode:"online", role:"guest", me:1, teams:[[],[]], active:[0,0], actions:[null,null], names:["상대",profile.nick||"나"], pool:myPool() };
  let peerTries=0;
  const MAXPEER=4;      // recreate whole peer only on hard network failure
  const MAXCONN=12;     // retry just the connect() this many times (host may still be registering)
  const startPeer=()=>{
    peerTries++;
    renderWait(peerTries>1?`호스트에 접속하는 중… (재접속 ${peerTries}/${MAXPEER})`:"호스트에 접속하는 중…");
    const peer=new Peer({debug:0,config:ICE});
    net={peer,conn:null,role:"guest",code};
    let opened=false, finished=false, connTries=0, connTimer=null;
    const hardFail=(msg)=>{ if(finished)return; finished=true; try{peer.destroy();}catch(e){}
      renderNetError(msg||"접속에 반복 실패했어요.\n· 코드가 맞는지\n· 상대가 방을 연 상태인지\n· 둘 다 인터넷에 연결됐는지 확인 후 다시 시도해 주세요."); };
    const peerRestart=()=>{ if(finished)return; finished=true; try{peer.destroy();}catch(e){}
      if(peerTries<MAXPEER){ setTimeout(startPeer, 700); } else { hardFail(); } };
    // one connect attempt; retries on peer-unavailable (host not yet registered)
    const tryConnect=()=>{
      if(finished||opened) return;
      connTries++;
      if(connTries>MAXCONN){ peerRestart(); return; }
      if(connTries>1) renderWait(`호스트를 찾는 중… (${connTries}/${MAXCONN})`);
      let c;
      try{ c=peer.connect("PKMNB-"+code,{reliable:true}); }catch(e){ setTimeout(tryConnect,1000); return; }
      net.conn=c;
      let thisDone=false;
      const bail=()=>{ if(thisDone||finished||opened)return; thisDone=true; try{c.close();}catch(e){} setTimeout(tryConnect,1100); };
      const ct=setTimeout(bail, 4500); // if this connection doesn't open quickly, retry connect
      c.on("open",()=>{ if(finished)return; thisDone=true; opened=true; finished=true; clearTimeout(ct); if(connTimer)clearTimeout(connTimer);
        try{ c.send({t:"hello",nick:profile.nick,code:profile.code}); }catch(e){} startHeartbeat(); onlineStartDraft(); });
      c.on("data",(d)=>onNetData(d));
      c.on("close",()=>{ if(!opened){ clearTimeout(ct); bail(); } else if(B&&B.phase!=="result"){ renderNetError("상대와의 연결이 끊겼어요."); } });
      c.on("error",()=>{ clearTimeout(ct); bail(); });
    };
    connTimer=setTimeout(()=>{ if(!opened) peerRestart(); }, 30000); // overall cap per peer
    peer.on("open",()=>{ tryConnect(); });
    peer.on("disconnected",()=>{ if(opened){ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} } });
    peer.on("error",(err)=>{
      const t=err&&err.type;
      if(opened) return;
      if(t==="peer-unavailable"){ setTimeout(tryConnect, 1100); return; } // host not registered yet → retry connect
      if(t==="network"||t==="server-error"||t==="socket-error"||t==="disconnected"){ peerRestart(); return; }
      hardFail("접속 실패: "+(t||"코드를 확인해 주세요"));
    });
  };
  startPeer();
}
function wireConn(c,onOpen){
  c.on("open",()=>{ try{ c.send({t:"hello",nick:profile.nick,code:profile.code}); }catch(e){} onOpen&&onOpen(); });
  c.on("data",(d)=>onNetData(d));
  c.on("close",()=>{ if(B&&B.phase!=="result") renderNetError("상대와의 연결이 끊겼어요."); });
  c.on("error",()=>{ if(B&&B.phase!=="result") renderNetError("통신 오류가 발생했어요."); });
}
function renderNetError(msg){
  if(!B) B={};
  B.phase="neterr";
  bview().innerHTML=`<div class="handoff"><div class="ho-ico">⚠️</div><div class="ho-msg">연결 문제</div>
    <div class="ho-sub">${msg}</div><button class="btn ghost" style="max-width:240px" onclick="quitBattle()">홈으로</button></div>`;
  window.scrollTo(0,0);
}

/* online draft entry (both start their own draft on connect) */
function onlineStartDraft(){ B.phase="draft"; B.dp=B.me; B.draw=shuffle(B.pool); B.sel=[]; renderDraft(); }

/* host: assemble battle once both teams ready */
function tryStartOnline(){
  if(B.role!=="host"||!B.hostReady||!B.guestTeam) return;
  if(B._started) return;
  B._started=true;
  B.teams[1]=B.guestTeam.map(makeMon);
  B.active=[0,0];
  initField();
  B.teams[0][0].seen=true; B.teams[1][0].seen=true;
  abLeadEntry();
  onlineStartTurn();
}
function snap(){ return {teams:B.teams,active:B.active,names:B.names,weather:B.weather,weatherN:B.weatherN,terrain:B.terrain,terrainN:B.terrainN,hazards:B.hazards,screens:B.screens,trickroom:B.trickroom,tailwind:B.tailwind,wish:B.wish}; }
function applySnap(s){ if(!s)return; B.teams=s.teams; B.active=s.active; if("weather"in s){B.weather=s.weather;B.weatherN=s.weatherN;B.terrain=s.terrain;B.terrainN=s.terrainN;B.hazards=s.hazards;B.screens=s.screens;B.trickroom=s.trickroom||0;B.tailwind=s.tailwind||[0,0];B.wish=s.wish||[null,null];} }

/* host turn driver */
function onlineStartTurn(){
  B.actions=[null,null]; B._resolved=false; B._advanced=false; B.turnNo=(B.turnNo||0)+1;
  sendGuest({t:"yourTurn",snap:snap(),turn:B.turnNo});
  const fa=forcedAction(0);
  if(fa){ B.actions[0]=fa; renderWait("상대의 선택을 기다리는 중…"); tryResolveOnline(); return; }
  B.chooseMode="main"; B.infoOpen=null; startTurnClock(); renderChoose(0);
}
function tryResolveOnline(){
  if(B.role!=="host") return;
  if(!B.actions[0]||!B.actions[1]) return;
  if(B._resolved) return;
  B._resolved=true; B._advanced=false;
  computeResolve();
  sendGuest({t:"resolved",snap:snap(),log:B.turnLog});
  B.phase="resolved"; bview().innerHTML=resolvedHTML(0,true); window.scrollTo(0,0);
}
/* host: continue after resolve */
function doAdvanceHost(){ if(B._advanced){ resendGuest(); return; } B._advanced=true; afterResolvedOnline(); }
function afterResolvedOnline(){
  for(let p=0;p<2;p++){ if(B.teams[p].every(m=>m.fainted)){ onlineEnd(1-p,false); return; } }
  B.repQueue=[0,1].filter(p=>B.teams[p][B.active[p]].fainted);
  callNextReplaceOnline();
}
function callNextReplaceOnline(){
  if(!B.repQueue||B.repQueue.length===0){ onlineStartTurn(); return; }
  const p=B.repQueue.shift();
  if(B.teams[p].every(m=>m.fainted)){ onlineEnd(1-p,false); return; }
  if(p===0){ renderReplace(0,"hostself"); }
  else{ B._awaitGuestReplace=true; sendGuest({t:"needReplace",snap:snap()}); renderWait("상대가 교체 중…"); }
}
function onlineEnd(winner,bySurrender){
  recordBattle(winner,bySurrender);
  B.phase="result";
  sendGuest({t:"result",winner,bySurrender,snap:snap()});
  bview().innerHTML=resultHTML(winner,bySurrender,B.me);
  window.scrollTo(0,0);
}

/* message router */
function onNetData(d){
  if(!B) return;
  if(net) net._lastRecv=Date.now();
  if(d.t==="ping"){ try{ if(net&&net.conn&&net.conn.open) net.conn.send({t:"pong"}); }catch(e){} return; }
  if(d.t==="pong"){ return; }
  if(d.t==="hello"){ B.oppNick=d.nick; B.oppCode=d.code; if(B.names){ B.names[B.role==="host"?1:0]=d.nick||"상대"; } return; }
  if(B.role==="host"){
    if(d.t==="sync"){ if(B._lastToGuest){ resendGuest(); } else if(B.hostReady&&B.guestTeam){ tryStartOnline(); } return; }
    if(d.t==="team"){ if(B._started){ resendGuest(); return; } B.guestTeam=d.team; tryStartOnline(); }
    else if(d.t==="act"){ if(d.turn!==B.turnNo || B._resolved){ resendGuest(); return; } B.actions[1]=d.action; tryResolveOnline(); }
    else if(d.t==="replacePick"){ if(!B._awaitGuestReplace){ resendGuest(); return; } B._awaitGuestReplace=false;
      if(!B.carryLog)B.carryLog=[]; doSwitchIn(1,d.idx,B.carryLog);
      if(B.teams[1][B.active[1]].fainted && !B.teams[1].every(m=>m.fainted)){ if(B.repQueue)B.repQueue.unshift(1); }
      callNextReplaceOnline(); }
    else if(d.t==="advance"){ doAdvanceHost(); }
    else if(d.t==="surrender"){ onlineEnd(0,true); }
  }else{ // guest
    clearPending(); clearGuestSync();
    if(d.t==="yourTurn"){ applySnap(d.snap); B.turnNo=d.turn; const fa=forcedAction(1); if(fa){ pendingSend({t:"act",action:fa,turn:B.turnNo}); renderWait("진행 중…"); } else { B.chooseMode="main"; B.infoOpen=null; startTurnClock(); renderChoose(1); } }
    else if(d.t==="resolved"){ applySnap(d.snap); B.turnLog=d.log||[]; B.phase="resolved"; bview().innerHTML=resolvedHTML(1,true); window.scrollTo(0,0); }
    else if(d.t==="needReplace"){ applySnap(d.snap); renderReplace(1,"guest"); }
    else if(d.t==="result"){ applySnap(d.snap); recordBattle(d.winner,d.bySurrender); B.phase="result"; bview().innerHTML=resultHTML(d.winner,d.bySurrender,1); window.scrollTo(0,0); }
  }
}

/* wire "계속" button to correct continuation */
function afterResolved(){ if(B.mode==="online"){ if(B.role==="host") doAdvanceHost(); else { pendingSend({t:"advance"}); renderWait("다음 턴을 준비 중…"); } return; } { /* hotseat */
  for(let p=0;p<2;p++){ if(B.teams[p].every(m=>m.fainted)){ endBattle(1-p,false); return; } }
  B.repQueue=[0,1].filter(p=>B.teams[p][B.active[p]].fainted); nextReplaceHotseat();
} }

/* ==== init ==== */
(async()=>{ try{ await loadProfile(); }catch(e){} try{ await loadTickets(); }catch(e){} try{ await loadCaught(); }catch(e){} updateTicketBtn(); })();
</script>
<!-- ===================== 뮤됴구 연동 (원본 줄은 그대로, 아래만 추가) ===================== -->
<script src="../mudyogu-sdk.js"></script>
<script>
(function () {
  var MUD = window.MudyoguSDK ? window.MudyoguSDK.create() : null;
  if (MUD) {
    window.MUD = MUD;
    if (MUD.isEmbedded) document.documentElement.classList.add('mud-embed');
  }

  /* ── 진행 코드 (다른 기기로 이어하기) ─────────────────────────────
     포획 목록 + 티켓 + 프로필 + 배틀 기록을 문자열로 만들어 앱 계정에 보관한다. */
  var CODE_PREFIX = 'PKQ1|';
  function b64e(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function b64d(b) {
    var bin = atob(b), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function buildCode() {
    return CODE_PREFIX + b64e(JSON.stringify({
      v: 1, caught: Array.from(caught), tickets: tickets, profile: profile,
      records: records.slice(-200), at: Date.now()
    }));
  }
  // 포획 목록은 합치고(합집합), 티켓/프로필/기록은 이 기기가 '새것'일 때만 가져온다.
  function applyCode(code) {
    try {
      var raw = String(code || '').replace(/\s+/g, '');
      if (raw.indexOf(CODE_PREFIX) !== 0) return false;
      var o = JSON.parse(b64d(raw.slice(CODE_PREFIX.length)));
      if (!o || typeof o !== 'object') return false;
      var fresh = caught.size === 0 && records.length === 0;
      var before = caught.size;
      if (Array.isArray(o.caught)) o.caught.forEach(function (id) { if (typeof id === 'number') caught.add(id); });
      if (caught.size !== before) origSaveCaught();
      if (fresh) {
        if (o.tickets && typeof o.tickets.n === 'number') { tickets = o.tickets; origSaveTickets(); }
        if (o.profile && o.profile.code) { profile = o.profile; origSaveProfile(); }
        if (Array.isArray(o.records)) { records = o.records; origSaveRecords(); }
      }
      try { updateHomeFoot(); checkTicketRewards(); updateTicketBtn(); } catch (e) {}
      return caught.size !== before || fresh;
    } catch (e) { return false; }
  }

  /* ── 앱에 기록 저장 ─────────────────────────────────────────────
     점수 = 포획 수. 새로 잡았을 때만 '기록 저장됨' 알림(isGameOver). */
  var ready = false, lastSynced = -1, pushTimer = null, pendingCode = null;
  function pushCodeSoon() {
    if (!MUD || !ready) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      if (caught.size === 0 && records.length === 0) return;
      try { MUD.saveCode({ code: buildCode(), label: '진행 코드' }); } catch (e) {}
    }, 1200);
  }
  function sync() {
    if (!MUD || !ready) return;
    var n = caught.size;
    var wins = records.filter(function (r) { return r && r.result === 'win'; }).length;
    try {
      MUD.save({
        score: n,
        state: { version: 1, caught: n, tickets: tickets.n, battles: records.length, wins: wins, nick: profile.nick || '' },
        isGameOver: lastSynced >= 0 && n > lastSynced
      });
    } catch (e) {}
    lastSynced = n;
    pushCodeSoon();
  }

  // 원본 저장 함수를 감싼다 (원본 코드는 그대로 호출됨)
  var origSaveCaught = saveCaught, origSaveTickets = saveTickets,
      origSaveRecords = saveRecords, origSaveProfile = saveProfile;
  saveCaught = async function () { var r = await origSaveCaught.apply(this, arguments); sync(); return r; };
  saveTickets = function () { var r = origSaveTickets.apply(this, arguments); pushCodeSoon(); return r; };
  saveRecords = function () { var r = origSaveRecords.apply(this, arguments); sync(); return r; };
  saveProfile = function () { var r = origSaveProfile.apply(this, arguments); pushCodeSoon(); return r; };

  function tryApplyPending() {
    if (!ready || !pendingCode) return;
    var c = pendingCode; pendingCode = null;
    if (applyCode(c)) sync();
  }
  if (MUD) {
    MUD.onInit(function (p) { if (p && p.savedCode) { pendingCode = p.savedCode; tryApplyPending(); } });
    MUD.onCode(function (c) { if (c) { pendingCode = c; tryApplyPending(); } });
  }

  // 원본의 초기화(load*)가 끝날 때까지 기다린다 (홈 하단에 '포획 N' 이 뜨면 완료)
  var tries = 0;
  (function waitInit() {
    var foot = document.getElementById('homeFoot');
    if ((foot && foot.textContent.indexOf('포획') >= 0) || ++tries > 100) {
      ready = true;
      sync();
      tryApplyPending();
      if (MUD) { try { MUD.requestCode(); } catch (e) {} try { MUD.ready(); } catch (e) {} }
      return;
    }
    setTimeout(waitInit, 100);
  })();

  window.mudyoguBuildCode = buildCode;
  window.mudyoguApplyCode = applyCode;

  /* ── 기록저장실 화면 맨 아래에 '진행 코드 옮기기' 칸 덧붙이기 (원본 화면은 그대로) ── */
  var TA = 'width:100%;min-height:60px;margin:8px 0;padding:10px 12px;border-radius:12px;resize:vertical;' +
           'border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink);' +
           'font-family:var(--mono);font-size:11px;line-height:1.45;word-break:break-all';
  function injectTransfer() {
    var view = document.getElementById('recview');
    if (!view || view.querySelector('#mudPk')) return;
    var box = document.createElement('div');
    box.id = 'mudPk';
    box.innerHTML =
      '<div class="bt-label" style="margin-top:16px">📦 진행 코드 옮기기</div>' +
      '<div class="prof-card">' +
        '<div class="bt-sub">포획 도감 · 티켓 · 대전 기록을 코드 하나로 옮겨요. 옮길 곳(다른 기기 · 뮤됴구 사이트)의 기록저장실에 붙여넣으세요. 포획 기록은 합쳐져요.</div>' +
        '<textarea id="mudPkOut" readonly style="' + TA + '"></textarea>' +
        '<button class="bt-act" id="mudPkCopy">코드 복사</button>' +
        '<textarea id="mudPkIn" placeholder="옮겨온 코드를 붙여넣기" style="' + TA + ';margin-top:14px"></textarea>' +
        '<button class="bt-act" id="mudPkApply">불러오기</button>' +
        '<div class="bt-sub" id="mudPkMsg" style="margin-top:8px"></div>' +
      '</div>';
    view.appendChild(box);
    var out = box.querySelector('#mudPkOut'), msg = box.querySelector('#mudPkMsg');
    out.value = buildCode();
    box.querySelector('#mudPkCopy').addEventListener('click', function () {
      out.value = buildCode(); pushCodeSoon();
      navigator.clipboard.writeText(out.value).then(function () { msg.textContent = '복사했어요.'; })
        .catch(function () { out.select(); msg.textContent = '자동 복사가 안 돼요. 선택해 둔 코드를 직접 복사해 주세요.'; });
    });
    box.querySelector('#mudPkApply').addEventListener('click', function () {
      var v = box.querySelector('#mudPkIn').value.replace(/\s+/g, '');
      if (!v) { msg.textContent = '코드를 붙여넣어 주세요.'; return; }
      var before = caught.size;
      if (applyCode(v)) {
        sync();
        msg.textContent = '불러왔어요! 포획 ' + before + ' → ' + caught.size + '마리';
        out.value = buildCode();
      } else {
        msg.textContent = '코드를 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여넣었는지 확인해 주세요. (이미 같은 기록이면 바뀌는 게 없어요)';
      }
    });
  }
  var origRenderRecords = renderRecords;
  renderRecords = function () { var r = origRenderRecords.apply(this, arguments); try { injectTransfer(); } catch (e) {} return r; };
})();

/* ===================== 뮤됴구: 화면 맞춤 (앱 안에서만) =====================
   원본 모양은 그대로 두고 페이지 전체를 '약간' 축소해서 홈 화면이 창 높이에
   딱 맞게 한다. 다른 화면도 같은 비율, 더 긴 화면은 스크롤.
   · 키우지 않음(최대 1배) · 최소 0.6배 · 폰 세로(폭 700 미만)는 축소 안 함 */
(function fitToScreen() {
  if (new URLSearchParams(location.search).get('mudEmbed') !== '1') return;
  var root = document.documentElement, homeH = 0;
  function onHome() { var h = document.getElementById('home'); return !!(h && h.classList.contains('on')); }
  function measureHome() {
    var app = document.getElementById('app'); if (!app) return 0;
    var prev = app.style.minHeight; app.style.minHeight = '0px';
    var h = app.offsetHeight; app.style.minHeight = prev;
    return h;
  }
  function fit() {
    if (window.innerWidth < 700) { root.style.zoom = ''; return; }
    if (onHome() || !homeH) { root.style.zoom = '1'; homeH = measureHome() || window.innerHeight; }
    var z = Math.min(1, Math.max(0.6, (window.innerHeight - 2) / homeH));
    root.style.zoom = String(Math.floor(z * 1000) / 1000);
  }
  var queued = false;
  function schedule() { if (queued) return; queued = true; requestAnimationFrame(function () { queued = false; fit(); }); }
  var home = document.getElementById('home');
  if (home) new MutationObserver(schedule).observe(home, { attributes: true, attributeFilter: ['class'] });
  window.addEventListener('resize', schedule);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
  window.addEventListener('load', schedule);
  window.mudyoguFit = fit;
  schedule();
})();
</script>
